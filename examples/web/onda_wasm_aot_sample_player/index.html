<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onda AOT Wasm Sample Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        background: #0b1015;
        color: #e8eef5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 15% 0%, #263e64 0, transparent 34rem), #0b1015;
      }
      main {
        width: min(720px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid #2a3642;
        border-radius: 18px;
        background: rgb(11 16 21 / 92%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
      }
      h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 36px); }
      p { color: #9cb0c3; line-height: 1.55; }
      .controls { display: grid; gap: 16px; margin: 24px 0; }
      .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
      label { display: grid; gap: 7px; color: #c2d0dd; }
      input[type="range"] { width: 100%; }
      button {
        padding: 10px 14px;
        border: 1px solid #314152;
        border-radius: 11px;
        background: #18212b;
        color: #dce7f2;
        font: inherit;
        cursor: pointer;
      }
      button.primary { border-color: #3676bd; background: #24568e; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status {
        min-height: 44px;
        padding: 12px;
        border: 1px solid #314152;
        border-radius: 11px;
        background: #0d141b;
        color: #a9bdd0;
      }
      .status.ready { border-color: #227a52; color: #9de2be; }
      .status.fail { border-color: #8a3a45; color: #f0a3ad; }
      code { color: #9dbfe8; }
    </style>
  </head>
  <body>
    <main>
      <h1>AOT Wasm sample player</h1>
      <p>
        This page contains no Onda compiler or Binaryen. It loads a precompiled processor artifact,
        binds <code>impulse.wav</code> to its <code>clip</code> buffer, and runs it in an AudioWorklet.
      </p>

      <div class="controls">
        <div class="buttons">
          <button class="primary" type="button" data-audio disabled>Start audio</button>
          <button type="button" data-play disabled>Play from start</button>
          <button type="button" data-stop-playback disabled>Stop playback</button>
        </div>

        <label>
          <span>Playback speed: <output data-speed-value>1.00</output>×</span>
          <input type="range" min="0.25" max="4" step="0.01" value="1" data-speed />
        </label>

        <label>
          <span>Amplitude input: <output data-amplitude-value>0.20</output></span>
          <input type="range" min="0" max="1" step="0.01" value="0.2" data-amplitude />
        </label>
      </div>

      <div class="status" data-status>Loading precompiled artifact…</div>
      <p data-summary></p>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@onda-lang/processor-abi": "./artifact.js"
        }
      }
    </script>
    <script type="module" src="./live.js"></script>
  </body>
</html>
