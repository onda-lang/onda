<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onda browser IDE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1015;
        --surface: #0d141b;
        --ink: #e8eef5;
        --text: #b8c7d5;
        --muted: #7890a5;
        --line: #314152;
        --soft: #143124;
        --code-bg: #081522;
        --code-ink: #e8eef5;
        --syntax-section: #a9d2ff;
        --syntax-keyword: #87b9ed;
        --syntax-type: #c9dbf2;
        --syntax-number: #91c4d8;
        --syntax-string: #b3d8cc;
        --syntax-constant: #d5e5f8;
        --syntax-function: #d8c9f2;
        --syntax-operator: #9db7d3;
        --syntax-comment: #7894b2;
        --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-family: var(--mono);
        background: var(--bg);
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 12% 0%, #17312a 0, transparent 34rem), var(--bg);
      }
      main { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; }
      header, .toolbar, .control-grid, .project-files, .project-file-tabs, .project-file-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      header { justify-content: space-between; margin-bottom: 18px; }
      h1, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font-size: clamp(22px, 4vw, 34px); }
      p { color: #9cb0c3; }
      .header-meta { display: flex; align-items: center; justify-content: flex-end; flex-wrap: nowrap; gap: 12px; }
      .shortcut-help { display: flex; align-items: center; flex-wrap: nowrap; gap: 5px 7px; margin: 0; color: var(--muted); font-size: 11px; }
      .shortcut { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      .shortcut > span { color: var(--text); font-weight: 650; }
      .shortcut-help kbd { display: inline-flex; align-items: center; min-height: 23px; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--soft); color: var(--ink); font: 600 10px/1 var(--mono); }
      .workspace { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(390px, .8fr); gap: 16px; align-items: stretch; }
      .panel {
        min-width: 0;
        padding: 16px;
        border: 1px solid #2a3642;
        border-radius: 16px;
        background: rgb(11 16 21 / 88%);
        box-shadow: 0 20px 70px rgb(0 0 0 / 24%);
      }
      .toolbar { justify-content: space-between; margin-bottom: 12px; }
      .control-grid { flex: 1 1 460px; }
      .control-grid label { display: grid; gap: 5px; flex: 1 1 130px; color: var(--text); }
      button, input, select { font: inherit; }
      button {
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #18212b;
        color: #dce7f2;
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: .55; }
      select {
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        inline-size: 116px;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #dce7f2;
        background: #18212b;
      }
      .status.ready { border-color: #227a52; background: var(--soft); color: #9de2be; }
      .status.fail { border-color: #8a3a45; background: #35181e; color: #f0a3ad; }
      .project-files { flex-wrap: nowrap; align-items: end; min-width: 0; margin-top: 12px; border-bottom: 1px solid var(--line); }
      .project-file-tabs { flex: 1 1 auto; flex-wrap: nowrap; min-width: 0; overflow-x: auto; overflow-y: hidden; align-items: end; gap: 0; scrollbar-width: thin; }
      .project-file-add { display: grid; place-items: center; align-self: flex-start; flex: 0 0 30px; width: 30px; min-height: 30px; margin-bottom: -1px; padding: 0; border-color: transparent transparent var(--line); border-radius: 7px 7px 0 0; background: transparent; color: var(--muted); font: 16px/1 system-ui, sans-serif; }
      .project-file-add:hover, .project-file-add:focus-visible { background: var(--soft); color: var(--ink); }
      .project-file-actions { align-self: flex-start; flex: 0 0 auto; flex-wrap: nowrap; gap: 4px; padding: 0 0 5px 8px; }
      .project-file-actions button { padding: 5px 7px; border-radius: 6px; font-size: 11px; }
      .project-file {
        display: flex;
        align-items: center;
        flex: 0 0 152px;
        width: 152px;
        min-width: 152px;
        max-width: 152px;
        min-height: 30px;
        margin-bottom: -1px;
        overflow: hidden;
        border: 1px solid transparent;
        border-bottom-color: var(--line);
        border-radius: 7px 7px 0 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        cursor: grab;
      }
      .project-file[data-dragging="true"] { opacity: .55; cursor: grabbing; }
      .project-file-tabs[data-dragging="true"] { cursor: grabbing; }
      .project-file-tabs[data-dragging="true"] .project-file { user-select: none; }
      .project-file-select {
        display: inline-flex;
        align-items: center;
        flex: 1 1 auto;
        min-width: 0;
        align-self: stretch;
        padding: 6px 2px 6px 8px;
        gap: 6px;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: grab;
      }
      .project-file-tabs[data-dragging="true"] .project-file-select { cursor: grabbing; }
      .project-file-close {
        display: grid;
        place-items: center;
        flex: 0 0 22px;
        align-self: stretch;
        width: 22px;
        padding: 0 5px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font: 13px/1 system-ui, sans-serif;
      }
      .project-file-close:hover:not(:disabled), .project-file-close:focus-visible { background: var(--soft); color: var(--ink); }
      .project-file-close:disabled { cursor: default; opacity: .28; }
      .project-file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .project-file-main, .project-file-library, .project-file-errors { flex: 0 0 auto; padding: 1px 4px; border-radius: 999px; font: 650 8px/1.25 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
      .project-file-main { background: var(--soft); color: #9de2be; }
      .project-file-library { border: 1px solid var(--line); color: var(--muted); }
      .project-file-errors { min-width: 16px; background: #8a3a45; color: #fff; text-align: center; }
      .project-file[data-active="true"] { border-color: var(--line) var(--line) var(--code-bg); background: var(--code-bg); color: var(--ink); }
      .project-file[data-kind="library"] .project-file-name { font-style: italic; }
      .source-editor {
        display: grid;
        width: 100%;
        height: min(68vh, 760px);
        min-height: 420px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0 0 12px 12px;
        background: var(--code-bg);
      }
      .source-editor:focus-within { border-color: #3e9c73; box-shadow: 0 0 0 3px rgb(62 156 115 / 16%); }
      .panel[aria-label="Onda run controls"] { display: flex; }
      .run-view { flex: 1 1 auto; width: 100%; min-height: 620px; border: 0; border-radius: 10px; background: var(--code-bg); }
      code { color: #9de2be; }
      @media (max-width: 980px) {
        .header-meta { justify-content: flex-start; flex-wrap: wrap; }
        .shortcut-help { flex-wrap: wrap; }
        .workspace { grid-template-columns: 1fr; }
        .source-editor { height: 540px; }
        .run-view { min-height: 680px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Onda browser IDE</h1>
          <p>The real Onda LSP, compiler, AudioWorklet runtime, and shared run view—entirely in this page.</p>
        </div>
        <div class="header-meta">
          <p class="shortcut-help" aria-label="Playground keyboard shortcuts">
            <span class="shortcut"><kbd>Ctrl/Cmd + Enter</kbd><span>Play</span></span>
            <span aria-hidden="true">·</span>
            <span class="shortcut"><kbd>Ctrl + Period</kbd><span>Stop</span></span>
          </p>
          <span class="status" aria-live="polite" data-status>Loading</span>
        </div>
      </header>

      <div class="workspace">
        <section class="panel">
          <div class="toolbar">
            <div class="control-grid">
              <label>
                <span>Sample rate</span>
                <select data-sample-rate>
                  <option value="48000" selected>48000 Hz</option>
                  <option value="44100">44100 Hz</option>
                </select>
              </label>
              <label>
                <span>Block size</span>
                <select data-block-size>
                  <option value="128">128 frames</option>
                  <option value="256">256 frames</option>
                  <option value="512" selected>512 frames</option>
                  <option value="1024">1024 frames</option>
                </select>
              </label>
            </div>
          </div>

          <div class="project-files">
            <div class="project-file-tabs" role="tablist" aria-label="Project files" data-file-tabs></div>
            <button class="project-file-add" type="button" data-new-file aria-label="New file" title="New file">+</button>
            <div class="project-file-actions">
              <button type="button" data-new-patch>New patch</button>
              <button type="button" data-rename-file>Rename</button>
              <button type="button" data-main-file>Set as main</button>
              <button type="button" data-share-project>Share</button>
            </div>
          </div>
          <div class="source-editor" aria-label="Onda project editor" data-editor></div>
        </section>

        <aside class="panel" aria-label="Onda run controls">
          <iframe class="run-view" title="Onda run view" data-run-view></iframe>
        </aside>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@onda-lang/wasm-compiler": "./onda-wasm-compiler/src/index.js",
          "@onda-lang/webaudio": "./onda-webaudio/index.js",
          "@onda-lang/processor-abi": "./onda-webaudio/processor-abi.js"
        }
      }
    </script>
    <script type="module" src="./playground.js"></script>
  </body>
</html>
