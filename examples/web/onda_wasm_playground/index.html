<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onda browser IDE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1e33;
        --surface: #102943;
        --ink: #f5f9ff;
        --text: #dbe9fa;
        --muted: #a8bfd9;
        --line: #2d5278;
        --soft: #143a63;
        --code-bg: #081522;
        --code-ink: #f5f9ff;
        --syntax-section: #a9d2ff;
        --syntax-keyword: #87b9ed;
        --syntax-type: #c9dbf2;
        --syntax-number: #91c4d8;
        --syntax-string: #b3d8cc;
        --syntax-constant: #d5e5f8;
        --syntax-function: #d8c9f2;
        --syntax-operator: #9db7d3;
        --syntax-comment: #7894b2;
        --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-family: var(--mono);
        background: var(--bg);
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
      }
      main { --play-viewport-offset: 64px; --play-stacked-offset: 64px; width: min(max(1920px, 84vw), calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; }
      .panel {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
      }
      button, input, select { font: inherit; }
      button {
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--soft);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: .55; }
      select, input[type="number"], input[type="text"] {
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
      }
      code { color: var(--ink); }
      @media (max-width: 720px) {
        main { --play-viewport-offset: 56px; --play-stacked-offset: 56px; width: calc(100% - 20px); padding-top: 16px; }
      }
    </style>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <main aria-label="Onda browser IDE">
      <span class="play-status" role="status" data-status>Loading compiler...</span>
      <div class="play-workspace">
        <section class="panel play-editor">
          <div class="project-files">
            <div class="project-file-tabs" data-file-tabs></div>
            <button class="project-file-add" type="button" data-new-file title="New file" aria-label="New file" disabled>+</button>
            <details class="project-menu" data-project-menu>
              <summary class="project-menu-trigger">Project</summary>
              <div class="project-menu-content">
                <button type="button" data-new-project>New project</button>
                <button type="button" data-open-project>Open project</button>
                <button type="button" data-download-project>Download project</button>
                <button type="button" data-share-project>Share</button>
                <label class="editor-font-size">
                  <span>Font size</span>
                  <input type="number" min="6" max="40" step="1" value="16" inputmode="numeric" title="Clear the value to restore automatic sizing: 16px on desktop and touch screens, 12px in narrow desktop windows." data-editor-font-size>
                </label>
                <dl class="project-shortcuts" aria-label="Keyboard shortcuts">
                  <div><dt>Play</dt><dd><kbd>Ctrl/⌘ S</kbd><kbd>Ctrl/⌘ ↵</kbd></dd></div>
                  <div><dt>Stop</dt><dd><kbd>Ctrl/⌘ .</kbd></dd></div>
                </dl>
              </div>
            </details>
          </div>
          <div class="play-source-editor" data-editor></div>
        </section>
        <aside class="panel play-run-panel" aria-busy="true">
          <p class="play-run-loading" data-run-loading aria-hidden="true">Loading compiler...</p>
          <iframe class="play-run-view" title="Onda run view" data-run-view></iframe>
        </aside>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@onda-lang/wasm-compiler": "./onda-wasm-compiler/src/index.js",
          "@onda-lang/webaudio": "./onda-webaudio/index.js",
          "@onda-lang/processor-abi": "./onda-webaudio/processor-abi.js"
        }
      }
    </script>
    <script type="module" src="./playground.js"></script>
  </body>
</html>
