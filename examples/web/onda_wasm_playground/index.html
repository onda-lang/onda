<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onda browser IDE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1e33;
        --surface: #102943;
        --ink: #f5f9ff;
        --text: #dbe9fa;
        --muted: #a8bfd9;
        --line: #2d5278;
        --soft: #143a63;
        --code-bg: #081522;
        --code-ink: #f5f9ff;
        --syntax-section: #a9d2ff;
        --syntax-keyword: #87b9ed;
        --syntax-type: #c9dbf2;
        --syntax-number: #91c4d8;
        --syntax-string: #b3d8cc;
        --syntax-constant: #d5e5f8;
        --syntax-function: #d8c9f2;
        --syntax-operator: #9db7d3;
        --syntax-comment: #7894b2;
        --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-family: var(--mono);
        background: var(--bg);
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
      }
      main { --play-viewport-offset: 160px; --play-stacked-offset: 192px; width: min(max(1920px, 84vw), calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      header { justify-content: space-between; margin-bottom: 18px; }
      h1, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font: 650 clamp(24px, 2vw, 32px)/1.2 system-ui, sans-serif; }
      p { color: var(--muted); }
      .header-meta { display: flex; align-items: center; justify-content: flex-end; flex-wrap: nowrap; gap: 14px; }
      .header-divider { flex-shrink: 0; width: 1px; height: 16px; background: var(--line); }
      .shortcut-help { display: flex; align-items: center; flex-wrap: nowrap; gap: 16px; margin: 0; color: var(--muted); }
      .shortcut { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
      .shortcut > span { color: var(--text); font-size: 11px; font-weight: 650; }
      .shortcut-help kbd { padding: 0; border: 0; background: none; color: var(--muted); font: 600 11px/1 var(--mono); }
      .panel {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
      }
      button, input, select { font: inherit; }
      button {
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--soft);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: .55; }
      select, input[type="number"], input[type="text"] {
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
      }
      .status {
        --status-color: var(--muted);
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }
      .status::before { display: inline-block; width: 7px; height: 7px; margin-right: 7px; vertical-align: middle; border-radius: 50%; background: var(--status-color); content: ""; }
      .status.ready { --status-color: var(--syntax-keyword); }
      .status.playing { --status-color: var(--syntax-string); }
      .status.fail { --status-color: #f0a3ad; color: #f0a3ad; }
      .play-source-editor:focus-within { border-color: var(--ink); box-shadow: 0 0 0 2px var(--soft); }
      code { color: var(--ink); }
      @media (max-width: 1280px) {
        .header-meta { justify-content: flex-start; flex-wrap: wrap; }
      }
      @media (max-width: 720px) {
        main { --play-viewport-offset: 160px; --play-stacked-offset: 192px; width: calc(100% - 20px); padding-top: 16px; }
        .header-meta { min-width: 0; flex-wrap: nowrap; justify-content: flex-start; width: 100%; gap: 10px; }
      }
      @media (max-width: 390px) {
        .header-meta { gap: 6px; }
        .shortcut-help { gap: 12px; }
      }
    </style>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Onda browser IDE</h1>
          <p>The real Onda LSP, compiler, AudioWorklet runtime, and shared run view—entirely in this page.</p>
        </div>
        <div class="header-meta">
          <span class="status" aria-live="polite" data-status>Loading compiler...</span>
          <span class="header-divider" aria-hidden="true"></span>
          <p class="shortcut-help" aria-label="Playground keyboard shortcuts">
            <span class="shortcut"><span>Play</span><kbd aria-label="Control or Command plus S or Enter">Ctrl/⌘ S · ↵</kbd></span>
            <span class="shortcut"><span>Stop</span><kbd aria-label="Control or Command plus period">Ctrl/⌘ .</kbd></span>
          </p>
        </div>
      </header>
      <div class="play-workspace">
        <section class="panel play-editor">
          <div class="play-toolbar">
            <div class="play-control-grid">
              <label>
                <span>Sample rate</span>
                <select data-sample-rate>
                  <option value="44100">44100 Hz</option>
                  <option value="48000" selected>48000 Hz</option>
                </select>
              </label>
              <label>
                <span>Block size</span>
                <select data-block-size>
                  <option value="128">128 samples</option>
                  <option value="256">256 samples</option>
                  <option value="512" selected>512 samples</option>
                  <option value="1024">1024 samples</option>
                  <option value="2048">2048 samples</option>
                </select>
              </label>
              <label>
                <span>Font size</span>
                <input type="number" min="6" max="40" step="1" value="16" inputmode="numeric" aria-label="Editor font size in pixels" title="Clear the value to restore automatic sizing: 16px on desktop and touch screens, 12px in narrow desktop windows." data-editor-font-size>
              </label>
            </div>
            <div class="project-file-actions">
              <button type="button" data-new-project>New project</button>
              <button type="button" data-open-project>Open project</button>
              <button type="button" data-download-project>Download project</button>
              <button type="button" data-share-project>Share</button>
            </div>
          </div>

          <div class="project-files">
            <div class="project-file-tabs" role="tablist" aria-label="Project files" data-file-tabs></div>
            <button class="project-file-add" type="button" data-new-file aria-label="New file" title="New file">+</button>
          </div>
          <div class="play-source-editor" aria-label="Onda project editor" data-editor></div>
        </section>
        <aside class="panel play-run-panel" aria-label="Onda run controls">
          <iframe class="play-run-view" title="Onda run view" data-run-view></iframe>
        </aside>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@onda-lang/wasm-compiler": "./onda-wasm-compiler/src/index.js",
          "@onda-lang/webaudio": "./onda-webaudio/index.js",
          "@onda-lang/processor-abi": "./onda-webaudio/processor-abi.js"
        }
      }
    </script>
    <script type="module" src="./playground.js"></script>
  </body>
</html>
