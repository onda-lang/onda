<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onda Run</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #081522;
        --panel: #0c1e33;
        --panel-strong: #122134;
        --panel-soft: #16273d;
        --text: #d8e5f3;
        --muted: #92a8bf;
        --accent: #c9dbf2;
        --accent-strong: #e0ebfa;
        --accent-soft: #233d5c;
        --border: #354e6d;
        --danger: #ff7e7e;
        --button-text: #08111d;
        --field-bg: #0d1827;
        --scope-bg: #0a1624;
        --scope-grid: rgba(201, 219, 242, 0.14);
        --scope-1: #c9dbf2;
        --scope-2: #7bade6;
        --scope-3: #7ad7ba;
        --scope-4: #f3b57b;
        --scrollbar-track: #081522;
        --scrollbar-thumb: #2d5278;
        --scrollbar-thumb-hover: #47739f;
        --shadow: 0 20px 60px rgba(3, 10, 18, 0.34);
        --mono-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #e8f1fc;
        --panel: #f5f9ff;
        --panel-strong: #f4f9ff;
        --panel-soft: #eaf2fb;
        --text: #143a63;
        --muted: #4e6a86;
        --accent: #143a63;
        --accent-strong: #0a213b;
        --accent-soft: #dbe8f7;
        --border: #bed1e5;
        --danger: #b53333;
        --button-text: #edf4fb;
        --field-bg: #ffffff;
        --scope-bg: #ecf4fd;
        --scope-grid: rgba(20, 58, 99, 0.12);
        --scope-1: #143a63;
        --scope-2: #2f76c5;
        --scope-3: #21956e;
        --scope-4: #bf7925;
        --scrollbar-track: #e8f1fc;
        --scrollbar-thumb: #9bb8d8;
        --scrollbar-thumb-hover: #6f94ba;
        --shadow: 0 18px 44px rgba(76, 109, 145, 0.18);
      }

      * {
        box-sizing: border-box;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        scrollbar-width: thin;
      }
      html {
        min-height: 100%;
        scrollbar-width: auto;
        background: var(--bg);
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      html::-webkit-scrollbar { width: 12px; height: 12px; }
      *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      *::-webkit-scrollbar-thumb {
        border: 2px solid var(--scrollbar-track);
        border-radius: 999px;
        background: var(--scrollbar-thumb);
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
      *::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        background: transparent;
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      .shell {
        display: grid;
        gap: 16px;
        width: 100%;
        margin: 0 auto;
      }

      .file-picker {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 36px);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .file-picker-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        max-width: 380px;
      }

      .file-picker-logo {
        width: 76px;
        height: 76px;
      }

      .file-picker-copy {
        color: var(--muted);
      }

      .file-picker-settings {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
        margin-top: 4px;
        text-align: left;
      }

      [hidden] {
        display: none !important;
      }

      .header, .buffers, .events, .params, .scope-section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .hero {
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
        min-height: 176px;
      }

      .hero-logo {
        width: 68px;
        height: 68px;
        display: block;
      }

      .hero-rule {
        width: 100%;
        height: 1px;
        background: var(--border);
        opacity: 0.9;
      }

      .title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .meta {
        color: var(--muted);
        word-break: break-word;
        font: 13px/1.45 var(--mono-font);
      }

      .status {
        color: var(--accent);
        font-weight: 600;
      }

      .error {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
        background: color-mix(in srgb, var(--panel-strong) 84%, black 16%);
        color: var(--danger);
        font: 12px/1.45 var(--mono-font);
        white-space: pre-wrap;
        word-break: break-word;
        display: none;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .io-settings {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
        align-items: end;
        gap: 10px;
      }

      .refresh-devices {
        white-space: nowrap;
        padding-inline: 12px;
      }

      @media (max-width: 430px) {
        .io-settings {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .refresh-devices {
          grid-column: 1 / -1;
          justify-self: center;
        }
      }

      button {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      button.primary {
        background: var(--accent);
        color: var(--button-text);
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.secondary {
        background: var(--accent-soft);
        color: var(--text);
        border-color: var(--border);
      }

      button.event-trigger {
        background: transparent;
        color: var(--accent);
        border-color: var(--border);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);
      }

      button.event-trigger:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border-color: var(--accent);
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .params-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      .params-toolbar {
        align-items: center;
      }

      .params-toolbar > .params-title {
        margin-right: auto;
      }

      .params-toolbar .params-disclosure {
        flex: 0 0 28px;
        width: 28px;
        justify-content: flex-end;
      }

      .param-layout-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field-bg);
      }

      .param-layout-toggle button {
        min-height: 28px;
        padding: 4px 8px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }

      .param-layout-toggle button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--text);
      }

      .section-toggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0;
        margin: 0;
        background: transparent;
        border: 0;
        color: inherit;
        text-align: left;
      }

      .section-toggle:hover:not(:disabled) {
        background: transparent;
      }

      .section-toggle::after {
        content: "▾";
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        transition: transform 120ms ease;
      }

      .section-toggle[aria-expanded="false"]::after {
        transform: rotate(-90deg);
      }

      .section-body {
        margin-top: 12px;
      }

      .section-body[hidden] {
        display: none !important;
      }

      .buffers-list {
        display: grid;
        gap: 6px;
      }

      .buffer-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 3px 10px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 7px 8px 7px 10px;
      }

      .buffer-identity {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
        white-space: nowrap;
      }

      .buffer-identity .param-name {
        flex: 0 1 auto;
        max-width: 55%;
      }

      .buffer-identity .param-type {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .buffer-detail {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .buffer-file {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font: 12px/1.4 var(--mono-font);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .buffer-metadata {
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--muted);
        font-family: var(--mono-font);
        font-size: 11px;
        white-space: nowrap;
      }

      .buffer-actions {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        gap: 5px;
      }

      #buffers {
        gap: 3px;
      }

      .buffer-actions .compact-action {
        min-height: 28px;
        padding: 3px 8px;
      }

      .compact-action {
        min-height: 30px;
        padding: 4px 9px;
        border-radius: 7px;
        font-size: 12px;
      }

      .param.event-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 0;
        overflow: hidden;
      }

      #events {
        gap: 3px;
      }

      .event-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 11px;
      }

      .event-identity {
        display: flex;
        flex: 1;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
      }

      .event-identity .param-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-summary {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .event-args {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
        padding: 9px 11px 11px;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 72%, var(--bg));
      }

      .event-arg {
        display: grid;
        grid-template-columns: minmax(7rem, 1fr) minmax(7rem, 10rem);
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .event-arg-heading {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }

      .event-arg-name {
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-arg-type {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .event-arg > .param-number {
        width: 100%;
        min-height: 30px;
        padding: 4px 7px;
        border-radius: 7px;
      }

      .event-arg > .param-toggle {
        justify-self: end;
        min-height: 30px;
        padding: 0 3px;
      }

      .event-array-arg {
        display: block;
        padding: 0;
      }

      .event-array-head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .event-array-count {
        color: var(--muted);
        font-size: 11px;
      }

      .event-array-actions {
        display: flex;
        gap: 5px;
        margin-left: auto;
      }

      .event-array-action {
        width: 25px;
        min-height: 25px;
        padding: 2px;
        border-radius: 6px;
        font-size: 11px;
      }

      .event-array-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
        gap: 7px;
        margin-top: 6px;
        padding: 7px;
        border-radius: 7px;
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .event-array-element {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        padding: 6px 7px 7px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }

      .event-array-index {
        flex: 0 0 1.65rem;
        color: var(--muted);
        font: 10px/1.2 var(--mono-font);
      }

      .event-array-element .param-number {
        width: 100%;
        min-width: 0;
        min-height: 28px;
        padding: 3px 6px;
        border-radius: 6px;
      }

      .event-array-element .param-toggle {
        min-height: 28px;
      }

      .event-array-note {
        margin-top: 6px;
        padding: 8px 9px;
        border-radius: 7px;
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--muted);
        font-size: 11px;
      }

      .event-empty {
        color: var(--muted);
        font-size: 12px;
      }

      .params-title {
        font-size: 14px;
        font-weight: 700;
      }

      .params-subtitle {
        color: var(--muted);
      }

      .param-list {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, 200px), 1fr)
        );
        gap: 8px;
      }

      .param {
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .param-head {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        flex-wrap: nowrap;
        gap: 6px;
        min-width: 0;
      }

      .param-name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .param-type {
        flex: 0 0 auto;
        color: var(--muted);
      }

      .param-name,
      .param-type,
      .event-arg-name,
      .event-arg-type {
        font-family: var(--mono-font);
      }

      .param-setting {
        display: grid;
        gap: 6px;
      }

      .param-setting-label {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .param-controls {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      /* Keep these card dimensions aligned with onda_egui::param_grid_columns. */
      #params[data-layout="sliders"] .param {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(88px, 104px);
        grid-template-rows: 26px 24px;
        grid-template-areas:
          "heading value"
          "control control";
        align-content: center;
        gap: 4px 8px;
        min-width: 0;
        height: 80px;
        padding: 8px 9px;
      }

      #params[data-layout="sliders"] .param-head {
        grid-area: heading;
        min-width: 0;
        align-self: center;
      }

      #params[data-layout="sliders"] .param-controls {
        display: contents;
      }

      #params[data-layout="sliders"] .param-slider {
        grid-area: control;
        align-self: center;
      }

      #params[data-layout="sliders"] .param-number {
        grid-area: value;
        align-self: center;
        height: 26px;
        padding: 3px 8px;
      }

      #params[data-layout="sliders"] .param-bool .param-controls {
        display: grid;
        grid-area: control;
        align-self: center;
        margin: 0;
      }

      .param-range {
        width: 100%;
      }

      .param-slider {
        position: relative;
        width: 100%;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--field-bg);
        cursor: pointer;
        touch-action: none;
      }

      .param-slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .param-slider-track {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 50%;
        height: 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--text) 10%, transparent);
        transform: translateY(-50%);
      }

      .param-slider-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      }

      .param-slider-thumb {
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--text);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--panel) 78%, transparent);
        transform: translate(-50%, -50%);
      }

      .param-knob {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto;
        cursor: ns-resize;
        touch-action: none;
      }

      .param-knob:focus-visible {
        border-radius: 50%;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .param-knob-dial {
        position: relative;
        width: 58px;
        height: 58px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background:
          radial-gradient(circle at center, var(--panel-soft) 0 58%, transparent 59%),
          conic-gradient(
            from 225deg,
            var(--accent) 0deg var(--knob-angle),
            color-mix(in srgb, var(--text) 14%, transparent) var(--knob-angle) 270deg,
            transparent 270deg
          );
        box-shadow: inset 0 0 0 3px var(--field-bg);
      }

      .param-knob-indicator {
        position: absolute;
        inset: 6px;
        transform: rotate(var(--knob-rotation));
      }

      .param-knob-indicator::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 3px;
        height: 12px;
        border-radius: 999px;
        background: var(--text);
        transform: translateX(-50%);
      }

      #params[data-layout="knobs"] {
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, 140px), 1fr)
        );
        gap: 8px;
      }

      #params[data-layout="knobs"] .param {
        min-width: 0;
        height: 140px;
        padding: 8px 9px;
      }

      #params[data-layout="knobs"] .param-head {
        min-width: 0;
        min-height: 1.45em;
        flex-wrap: nowrap;
        align-items: baseline;
        justify-content: center;
        gap: 2px 6px;
        text-align: center;
      }

      #params[data-layout="knobs"] .param-name {
        min-width: 0;
      }

      #params[data-layout="knobs"] .param-type {
        flex: 0 0 auto;
      }

      #params[data-layout="knobs"] .param-controls {
        gap: 4px;
        margin-top: 4px;
      }

      #params[data-layout="knobs"] .param-number {
        justify-self: center;
        width: 104px;
        height: 26px;
        padding: 3px 8px;
      }

      .param-number {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--field-bg);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }

      .param-select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--field-bg);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }

      .param-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
      }

      .empty {
        color: var(--muted);
      }

      .scope-section {
        display: none;
      }
      .scope-canvas {
        width: 100%;
        height: 140px;
        border-radius: 10px;
        background: var(--scope-bg);
        display: block;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
        }

        .header, .buffers, .events, .params, .scope-section {
          padding: 12px;
          border-radius: 12px;
        }

        .hero {
          min-height: 160px;
        }

        .param {
          min-width: 0;
          padding: 9px;
          border-radius: 10px;
        }

        .param-head {
          min-width: 0;
          flex-wrap: nowrap;
          gap: 6px;
        }

        .param-type {
          flex: 0 0 auto;
        }

        .param-controls {
          gap: 7px;
          margin-top: 7px;
        }

        .param-number {
          min-width: 0;
          padding: 7px 8px;
        }

        .buffer-card {
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .event-identity {
          align-items: flex-start;
          flex-direction: column;
          gap: 2px;
        }

        .event-arg {
          grid-template-columns: minmax(0, 1fr) minmax(6.5rem, 8rem);
        }

        .event-array-grid {
          grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
        }
      }
    </style>
    <script>
      if (!globalThis.__ONDA_PARAM_CONTROL_V2__) {
        document.write('<script src="./param-control.js"><\/script>');
      }
    </script>
  </head>
  <body>
    <div class="shell">
      <section class="file-picker" id="file-picker" hidden>
        <div class="file-picker-content">
