<!DOCTYPE html>
<html lang="en" data-run-view-pending>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onda Run</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0d1929;
        --panel: #0c1e33;
        --panel-strong: #122134;
        --panel-soft: #121f31;
        --text: #d8e5f3;
        --muted: #92a8bf;
        --accent: #c9dbf2;
        --accent-strong: #e0ebfa;
        --accent-soft: #233d5c;
        --border: #354e6d;
        --success: #7ad7ba;
        --transport-text: var(--bg);
        --danger: #ff7e7e;
        --button-text: #08111d;
        --field-bg: #0d1827;
        --scope-bg: #0a1624;
        --scope-grid: rgba(201, 219, 242, 0.14);
        --scope-1: #c9dbf2;
        --scope-2: #7bade6;
        --scope-3: #7ad7ba;
        --scope-4: #f3b57b;
        --scrollbar-track: #081522;
        --scrollbar-thumb: #2d5278;
        --scrollbar-thumb-hover: #47739f;
        --piano-bed: #081522;
        --piano-white: #afc2d9;
        --piano-white-hover: #c9dbf2;
        --piano-white-active: #7bade6;
        --piano-black: #09131f;
        --piano-black-hover: #162e49;
        --piano-black-active: #5f91c9;
        --piano-key-border: #354e6d;
        --shadow: 0 20px 60px rgba(3, 10, 18, 0.34);
        --mono-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* Shared with the native view: controls 5, groups 8, cards 9, sections 12. */
        --radius-control: 5px;
        --radius-group: 8px;
        --radius-card: 9px;
        --radius-section: 12px;
        --radius-window: 14px;
        --radius-round: 999px;
        --header-control-size: 32px;
        --header-gap: 12px;
        --header-identity-gap: 16px;
        --header-action-gap: 8px;
        --header-divider-width: 1px;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #dbe8f7;
        --panel: #f5f9ff;
        --panel-strong: #f4f9ff;
        --panel-soft: #f4f9ff;
        --text: #143a63;
        --muted: #4e6a86;
        --accent: #143a63;
        --accent-strong: #0a213b;
        --accent-soft: #dbe8f7;
        --border: #bed1e5;
        --success: #136c4c;
        --danger: #b53333;
        --button-text: #edf4fb;
        --field-bg: #ffffff;
        --scope-bg: #ecf4fd;
        --scope-grid: rgba(20, 58, 99, 0.12);
        --scope-1: #143a63;
        --scope-2: #2f76c5;
        --scope-3: #21956e;
        --scope-4: #bf7925;
        --scrollbar-track: #e8f1fc;
        --scrollbar-thumb: #9bb8d8;
        --scrollbar-thumb-hover: #6f94ba;
        --piano-bed: #dbe8f7;
        --piano-white: #f8fbff;
        --piano-white-hover: #eaf2fb;
        --piano-white-active: #9bb8d8;
        --piano-black: #143a63;
        --piano-black-hover: #24547f;
        --piano-black-active: #2f76c5;
        --piano-key-border: #91aac5;
        --shadow: 0 18px 44px rgba(76, 109, 145, 0.18);
      }

      * {
        box-sizing: border-box;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        scrollbar-width: thin;
      }
      html {
        height: 100%;
        min-height: 100%;
        background: var(--bg);
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      .shell::-webkit-scrollbar { width: 12px; height: 12px; }
      *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      *::-webkit-scrollbar-thumb {
        border: 2px solid var(--scrollbar-track);
        border-radius: var(--radius-round);
        background: var(--scrollbar-thumb);
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
      *::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100%;
        overflow: hidden;
        padding: 0;
        background: transparent;
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      .onda-version {
        color: var(--muted);
        font: 11px/1.2 var(--mono-font);
        white-space: nowrap;
      }

      .shell {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        gap: 12px;
        width: 100%;
        min-height: 0;
        margin: 0 auto;
        padding: 12px 12px 0;
        overflow-y: auto;
        scrollbar-width: auto;
        scrollbar-gutter: stable;
      }
      html[data-run-view-pending] .shell { visibility: hidden; }
      /* The final grid gap scrolls with the content instead of staying above the dock. */
      .shell::after { content: ""; height: 0; }

      .file-picker {
        position: relative;
        display: grid;
        place-items: center;
        min-height: calc(100vh - 24px);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius-window);
        background: var(--panel);
        text-align: center;
      }

      .file-picker-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .file-picker-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        max-width: 380px;
      }

      .file-picker-logo {
        width: 76px;
        height: 76px;
      }

      .file-picker-copy {
        color: var(--muted);
      }

      .file-picker-settings {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
        margin-top: 4px;
        text-align: left;
      }

      .file-picker-settings .param-setting-label {
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      .header, .buffers, .events, .params, .scope-section {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-section);
        padding: 10px 8px;
      }

      .hero {
        display: grid;
        gap: 8px;
      }

      .header {
        padding: 8px 12px;
      }

      .hero-identity {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) max-content;
        align-items: center;
        gap: var(--header-identity-gap);
        min-width: 0;
        min-height: 40px;
      }

      .hero-brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-self: start;
        gap: 4px;
        padding-right: calc(var(--header-identity-gap) + var(--header-divider-width));
      }

      .hero-brand::after {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        width: var(--header-divider-width);
        height: var(--header-control-size);
        background: var(--border);
        transform: translateY(-50%);
      }

      .hero-controls {
        display: flex;
        align-items: center;
        gap: var(--header-gap);
        justify-self: end;
      }

      .hero-source {
        min-width: 0;
        text-align: left;
      }

      .hero-file-details {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .transport {
        flex: 0 0 auto;
      }

      .hero-controls.has-transport .actions {
        padding-left: var(--header-gap);
        border-left: var(--header-divider-width) solid var(--border);
      }

      .hero-logo {
        justify-self: center;
        width: 32px;
        height: 32px;
        display: block;
      }

      .meta {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font: 600 15px/20px var(--mono-font);
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .error {
        padding: 10px 12px;
        border-radius: var(--radius-card);
        border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
        background: color-mix(in srgb, var(--panel-strong) 84%, black 16%);
        color: var(--danger);
        font: 12px/1.45 var(--mono-font);
        white-space: pre-wrap;
        word-break: break-word;
        display: none;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: var(--header-action-gap);
      }

      .actions button {
        display: grid;
        place-items: center;
        width: var(--header-control-size);
        height: var(--header-control-size);
        flex: 0 0 var(--header-control-size);
        padding: 0;
        color: var(--muted);
      }

      .transport button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 72px;
        height: calc(var(--header-control-size) - 4px);
        padding: 0;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }

      .actions svg, .transport svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        fill: currentColor;
      }

      .actions button.secondary {
        background: transparent;
        color: var(--muted);
        border-color: transparent;
      }

      .actions button.secondary:is(:hover, :focus-visible, [aria-expanded="true"]):not(:disabled) {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--text);
      }

      #start { --transport-color: var(--success); }
      #stop { --transport-color: var(--danger); }

      .transport button.secondary {
        color: var(--transport-color);
        background: color-mix(in srgb, var(--transport-color) 10%, transparent);
        border-color: color-mix(in srgb, var(--transport-color) 60%, transparent);
      }

      .transport button.secondary:is(:hover, :focus-visible):not(:disabled) {
        background: color-mix(in srgb, var(--transport-color) 20%, transparent);
        border-color: var(--transport-color);
      }

      .transport button.secondary:active:not(:disabled) {
        background: color-mix(in srgb, var(--transport-color) 30%, transparent);
      }

      #start.secondary {
        background: var(--success);
        border-color: var(--success);
        color: var(--transport-text);
      }

      #start.secondary:is(:hover, :focus-visible):not(:disabled) {
        background: color-mix(in srgb, var(--success) 85%, var(--text));
      }

      .actions button:focus-visible,
      .transport button:focus-visible,
      .header-popover :is(button, select):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .header-popover {
        position: fixed;
        inset: auto;
        width: min(256px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        margin: 0;
        padding: 10px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-section);
        background: var(--panel);
        color: var(--text);
        box-shadow: var(--shadow);
        font: inherit;
      }

      .io-settings {
        display: none;
        grid-template-columns: minmax(0, 1fr);
        align-items: end;
        gap: 12px;
      }

      .refresh-devices {
        white-space: nowrap;
        padding-inline: 12px;
      }

      .io-settings .param-setting {
        gap: 4px;
        min-width: 0;
      }

      .io-settings .param-setting-label {
        text-align: left;
        text-transform: none;
        letter-spacing: normal;
      }

      .io-settings .param-select,
      .io-settings .refresh-devices {
        height: 32px;
        padding: 3px 8px;
        font-size: 12px;
      }

      .io-settings .param-select {
        padding-right: 24px;
      }

      button {
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        padding: 8px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      html[data-run-view-pending] button {
        transition: none;
      }

      button.primary {
        background: var(--accent);
        color: var(--button-text);
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.secondary {
        background: var(--accent-soft);
        color: var(--text);
        border-color: var(--border);
      }

      button.event-trigger {
        background: transparent;
        color: var(--accent);
        border-color: var(--border);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);
      }

      button.event-trigger:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border-color: var(--accent);
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .params-header {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: 8px;
      }

      .params-toolbar {
        width: 100%;
        min-height: 26px;
      }

      .section-heading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .section-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-width: 0;
        gap: 8px;
      }

      #reset-params,
      .param-smoothing,
      .param-layout-toggle {
        height: 26px;
        min-height: 26px;
        font-size: 12px;
      }

      .params {
        container-type: inline-size;
      }

      .params .section-actions {
        flex-wrap: wrap;
        justify-content: end;
        gap: 6px;
      }

      @container (max-width: 340px) {
        .params-toolbar {
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
        }
      }

      @container (max-width: 110px) {
        .param-smoothing-label { display: none; }
      }

      .reset-action {
        display: grid;
        place-items: center;
        flex: 0 0 26px;
        width: 26px;
        height: 26px;
        padding: 0;
      }

      .reset-action svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .param-smoothing {
        display: inline-flex;
        flex: 0 0 112px;
        width: 112px;
        max-width: 100%;
        min-width: 0;
        align-items: center;
        gap: 0.25em;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--field-bg);
        color: var(--muted);
        cursor: ew-resize;
        touch-action: none;
        user-select: none;
      }

      .param-smoothing:focus-within {
        border-color: var(--accent);
      }

      .param-smoothing input {
        appearance: textfield;
        field-sizing: fixed;
        flex: 1;
        width: 0;
        min-width: 1ch;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: right;
        font-variant-numeric: tabular-nums;
        outline: none;
      }

      .param-smoothing input:not(:read-only) {
        cursor: text;
        user-select: text;
      }

      .param-smoothing input::-webkit-inner-spin-button,
      .param-smoothing input::-webkit-outer-spin-button {
        appearance: none;
        margin: 0;
      }

      .param-layout-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        max-width: 100%;
        gap: 2px;
        padding: 1px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--field-bg);
      }

      .param-layout-toggle button {
        min-width: 0;
        flex: 1;
        min-height: 0;
        padding: 2px 8px;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: var(--muted);
      }

      .param-layout-toggle button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--text);
      }

      .param-layout-toggle button:is(:hover, :focus-visible):not(:disabled) {
        box-shadow: inset 0 0 0 1px var(--accent);
        color: var(--text);
      }

      .section-toggle {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        width: auto;
        min-width: 14px;
        padding: 0;
        margin: 0;
        background: transparent;
        border: 0;
        color: inherit;
        text-align: left;
      }

      .section-toggle:hover:not(:disabled) {
        background: transparent;
      }

      .section-toggle::before {
        content: "▾";
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        transition: transform 120ms ease;
      }

      .section-toggle[aria-expanded="false"]::before {
        transform: rotate(-90deg);
      }

      .section-body {
        margin-top: 8px;
      }

      .section-body[hidden] {
        display: none !important;
      }

      .buffers-list {
        display: grid;
        gap: 6px;
      }

      .buffer-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 3px 10px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 7px 8px 7px 10px;
      }

      .buffer-identity {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
        white-space: nowrap;
      }

      .buffer-identity .param-name {
        flex: 0 1 auto;
        max-width: 55%;
      }

      .buffer-identity .param-type {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .buffer-detail {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .buffer-file {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font: 12px/1.4 var(--mono-font);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .buffer-metadata {
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--muted);
        font-family: var(--mono-font);
        font-size: 11px;
        white-space: nowrap;
      }

      .buffer-waveform {
        grid-column: 1 / -1;
        min-width: 0;
        margin-top: 3px;
      }

      .buffer-waveform canvas {
        display: block;
        width: 100%;
        height: 62px;
        border-radius: 6px;
        background: var(--scope-bg);
      }

      .buffer-actions {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        gap: 5px;
      }

      #buffers {
        gap: 3px;
      }

      .buffer-actions .compact-action {
        min-height: 28px;
        padding: 3px 8px;
      }

      .compact-action {
        min-height: 30px;
        padding: 4px 9px;
        border-radius: var(--radius-control);
        font-size: 12px;
      }

      .param.event-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 0;
        overflow: hidden;
      }

      #events {
        gap: 3px;
      }

      .event-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 11px;
      }

      .event-identity {
        display: flex;
        flex: 1;
        align-items: baseline;
        min-width: 0;
      }

      .event-identity .param-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-args {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
        padding: 9px 11px 11px;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 72%, var(--bg));
      }

      .event-arg {
        display: grid;
        grid-template-columns: minmax(7rem, 1fr) minmax(7rem, 10rem);
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .event-arg-heading {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }

      summary.event-arg-heading {
        list-style: none;
      }

      summary.event-arg-heading::-webkit-details-marker {
        display: none;
      }

      summary.event-arg-heading::before {
        content: "▾";
        flex: 0 0 auto;
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        transition: transform 120ms ease;
      }

      details:not([open]) summary.event-arg-heading::before {
        transform: rotate(-90deg);
      }

      .event-arg-name {
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-arg-type {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .event-arg > .param-number {
        width: 100%;
        min-height: 30px;
        padding: 4px 7px;
        border-radius: var(--radius-control);
      }

      .event-arg > .param-toggle {
        justify-self: end;
        min-height: 30px;
        padding: 0 3px;
      }

      .event-structured-arg {
        display: block;
      }

      .event-structured-heading {
        cursor: pointer;
        padding: 4px 0;
      }

      .event-structured-arg[open] > .event-structured-heading {
        margin-bottom: 6px;
      }

      .event-structured-arg > textarea {
        box-sizing: border-box;
        width: 100%;
        resize: none;
        font-family: var(--mono-font);
      }

      .event-structured-arg > textarea:focus {
        outline: none;
      }

      .event-array-arg {
        display: block;
        padding: 0;
      }

      .event-array-head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .event-array-count {
        color: var(--muted);
        font-size: 11px;
      }

      .event-array-actions {
        display: flex;
        gap: 5px;
        margin-left: auto;
      }

      .event-array-action {
        width: 25px;
        min-height: 25px;
        padding: 2px;
        border-radius: var(--radius-control);
        font-size: 11px;
      }

            },

            mode: "browser",
            postMessage(msg) {

                if (settled) return;

                window.removeEventListener("focus", cleanupAfterCancel);
                input.remove();
              };
              const cleanupAfterCancel = () => {
                setTimeout(() => {
                  if (!input.files?.length) cleanup();
                }, 0);
              };

                const file = input.files && input.files[0];
                if (file) {
                  window.parent.postMessage({
                    __ondaRunWebview: true,
                    message: { type: "bindBufferFile", name, file },
                  }, targetOrigin);
                }
                cleanup();
              }, { once: true });
              input.addEventListener("cancel", cleanup, { once: true });
              window.addEventListener("focus", cleanupAfterCancel, { once: true });
              document.body.appendChild(input);
              input.click();
            },
            onMessage(callback) {
              window.addEventListener("message", (event) => {
                if (
                  event.source !== window.parent
                  || event.origin !== targetOrigin
                  || !event.data?.__ondaRunHost

                callback(event.data.message);
              });
            },
          };
        }

          mode: "wry",
          postMessage(msg) {

      function scheduleScrollViewState() {
        clearTimeout(scrollPublishTimer);

            if (!Array.isArray(saved?.values)) continue;

        virtualMidiSources.set(source, note);
        virtualMidiNoteCounts.set(note, count + 1);
        if (count === 0) postVirtualMidiNote(note, true);
        renderVirtualMidiNotes();

      function releaseVirtualMidiNote(source) {

        if (count === 0) {

      function renderVirtualMidiNotes() {

      function appendPianoKey(offset, className, boundary) {

      function updateMidiKeyboardLayout() {

          Math.floor((128 - midiBaseNote()) / 12));
        const whiteCount = octaves * WHITE_MIDI_NOTES.length;
        const width = Math.min(availableWidth, whiteCount * 72);

        pianoNode.style.setProperty("--piano-white-keys", String(whiteCount));

        if (octaves !== pianoOctaves) {
          pianoOctaves = octaves;
          const keys = new Map([...pianoNode.children].map(key => [Number(key.dataset.noteOffset), key]));
          for (const [offset, key] of keys) {
            if (offset < octaves * 12) continue;
            for (const [source, note] of virtualMidiSources) {

            }
            const focused = document.activeElement === key;
            key.remove();

            }
            for (const [offset, boundary] of BLACK_MIDI_NOTES) {
              if (!keys.has(octave * 12 + offset)) {

              }
            }

        for (const key of pianoNode.querySelectorAll(".black")) {

        }

      function drawScope(channels, samples) {
        const dpr = window.devicePixelRatio || 1;
        const rect = scopePixelSize ? null : scopeCanvas.getBoundingClientRect();
        const w = scopePixelSize?.width ?? Math.round(rect.width * dpr);
        const h = scopePixelSize?.height ?? Math.round(rect.height * dpr);
        if (scopeCanvas.width !== w || scopeCanvas.height !== h) {
          scopeCanvas.width = w;
          scopeCanvas.height = h;
        }
        if (w === 0 || h === 0) return;
        scopeCtx.clearRect(0, 0, w, h);
        channels = channels || state.outputChannels || 0;
        if (channels === 0) return;
        const frames = Math.floor(samples.length / channels);

        const computed = getComputedStyle(document.documentElement);
        const gridColor = computed.getPropertyValue("--scope-grid").trim();
        const color = computed.getPropertyValue("--scope-1").trim();
        const chHeight = h / channels;
        const traceWidth = Math.max(1, Math.round(1.5 * dpr));
        const halfPixel = traceWidth % 2 ? 0.5 : 0;
        const silent = samples.every(sample => sample === 0);
        for (let ch = 0; ch < channels; ch++) {
          const yCenter = Math.round(chHeight * (ch + 0.5) - halfPixel) + halfPixel;
          const amplitude = chHeight / 2 * 0.85;

          scopeCtx.strokeStyle = gridColor;
          scopeCtx.lineWidth = 1;
          scopeCtx.beginPath();
          scopeCtx.moveTo(0, yCenter);
          scopeCtx.lineTo(w, yCenter);
          scopeCtx.stroke();
          if (!state.running || frames === 0) continue;

          scopeCtx.strokeStyle = color;
          scopeCtx.lineWidth = traceWidth;
          scopeCtx.beginPath();
          if (silent) {
            scopeCtx.moveTo(0, yCenter);
            scopeCtx.lineTo(w - 1, yCenter);
          } else {
            for (let i = 0; i < w; i++) {
              const frameIdx = Math.floor(i * frames / w);
              const sample = samples[frameIdx * channels + ch];
              const clamped = Math.max(-1, Math.min(1, sample));
              const y = yCenter - clamped * amplitude;
              if (i === 0) {
                scopeCtx.moveTo(i, y);
              } else {
                scopeCtx.lineTo(i, y);
              }
            }
          }
          scopeCtx.stroke();
        }
      }

      function scheduleScopeDraw(channels, samples) {

        pendingScopeFrame = window.requestAnimationFrame(() => {

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      const KNOB_ARC_CENTER = 29;
      const KNOB_ARC_RADIUS = 25;
      const KNOB_ARC_START_DEGREES = 135;
      const KNOB_ARC_SWEEP_DEGREES = 270;

      function knobValueArcPath(normalized) {
        const ratio = clamp(normalized, 0, 1);
        if (ratio === 0) {
          return "";
        }

        const startRadians = KNOB_ARC_START_DEGREES * Math.PI / 180;
        const endRadians = (
          KNOB_ARC_START_DEGREES + ratio * KNOB_ARC_SWEEP_DEGREES
        ) * Math.PI / 180;
        const point = (radians) => [
          KNOB_ARC_CENTER + KNOB_ARC_RADIUS * Math.cos(radians),
          KNOB_ARC_CENTER + KNOB_ARC_RADIUS * Math.sin(radians),
        ];
        const [startX, startY] = point(startRadians);
        const [endX, endY] = point(endRadians);
        const largeArc = ratio * KNOB_ARC_SWEEP_DEGREES > 180 ? 1 : 0;
        return `M ${startX} ${startY} A ${KNOB_ARC_RADIUS} ${KNOB_ARC_RADIUS} 0 ${largeArc} 1 ${endX} ${endY}`;
      }

      function decimalPlaces(step) {
        const [coefficient, exponentText] = String(step).toLowerCase().split("e");
        const fractionDigits = coefficient.split(".")[1]?.length ?? 0;
        const exponent = exponentText === undefined ? 0 : Number(exponentText);
        return Math.max(0, fractionDigits - exponent);
      }

      const FLOAT_CONTROL_TARGET_STEPS = 2000;
      const FLOAT_CONTROL_MIN_STEP = 0.0001;
      const FLOAT_CONTROL_MAX_STEP = 0.1;
      const PARAM_NUMBER_DRAG_PIXELS_PER_RANGE = 375;
      const PARAM_KNOB_DRAG_PIXELS_PER_RANGE = 250;
      const EVENT_STRUCTURED_MIN_VISIBLE_LINES = 4;
      const EVENT_STRUCTURED_MAX_VISIBLE_LINES = 20;

      function structuredEventVisibleLines(value) {
        return Math.max(
          EVENT_STRUCTURED_MIN_VISIBLE_LINES,
          Math.min(EVENT_STRUCTURED_MAX_VISIBLE_LINES, value.split("\n").length),
        );
      }

      function scalarStepForParam(param) {
        // Keep this host policy aligned with onda_egui::scalar_step.
        const declaredStep = Number(param.step);
        if (Number.isFinite(declaredStep) && declaredStep > 0) {
          return declaredStep;
        }
        if (param.type === "i32" || param.type === "i64") {
          return 1;
        }
        const min = Number(param.rangeMin);
        const max = Number(param.rangeMax);
        if (Number.isFinite(min) && Number.isFinite(max)) {
          const span = Math.abs(max - min);
          if (Number.isFinite(span) && span > 0) {
            const rawStep = Math.max(
              span / FLOAT_CONTROL_TARGET_STEPS,
              FLOAT_CONTROL_MIN_STEP,
            );
            const exponent = Math.floor(Math.log10(rawStep));
            return Math.min(Math.pow(10, exponent), FLOAT_CONTROL_MAX_STEP);
          }
        }
        return 0.001;
      }

      function scalarDragSpeedForParam(param) {
        // Keep this host policy aligned with onda_egui::scalar_drag_speed.
        if (param.type === "i32" || param.type === "i64") return 0.25;
        return 0.01;
      }

      function formatNumberForInput(value, step) {
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) {
          return "0";
        }
        const places = decimalPlaces(step);
        if (places > 8) {
          return String(numericValue);
        }
        if (places === 0) {
          return String(Math.round(numericValue));
        }
        return numericValue
          .toFixed(places)
          .replace(/\.?0+$/, "");
      }

      function quantizeToStep(value, min, step) {
        if (!Number.isFinite(step) || step <= 0) {
          return value;
        }
        return min + Math.round((value - min) / step) * step;
      }

      const paramControlCache = new WeakMap();

      function paramControl(param) {
        let control = paramControlCache.get(param);

          input(nextValue) { update(nextValue, "input"); },
          commit(nextValue) { update(nextValue, "commit"); },

      function flushPendingParamMessages() {

          param.curve,
          param.unit,
          param.step,
          param.stepCount,

      function createEventScalarControl(type, value, defaultValue, onChange) {
        if (type === "bool") {
          const toggle = document.createElement("label");
          toggle.className = "param-toggle";
          const input = document.createElement("input");

      // ---------------------------------------------------------------------------
      // Message handler
      // ---------------------------------------------------------------------------

      hostBridge.onMessage((message) => {
        if (!message) {
          return;
        }
        if (message.type === "computerKey") {
          handleComputerMidiKey(message.code, message.pressed === true);
          return;
        }
        if (message.type === "releaseVirtualMidiNotes") {
          releaseAllVirtualMidiNotes();
          return;
        }
        if (message.type === "midiActivity") {
          setMonitoredMidiNotes(message.activeNotes);
          return;
        }
        if (message.type === "scopeData") {
          scheduleScopeDraw(message.channels, message.samples);
          return;
        }
        if (message.type === "viewState") {
          restoreViewState(message.state);
          return;
        }
        if (message.type !== "state") {

          || (incoming.currentMidiInputDevice !== undefined

        const savedViewState = incoming.viewState;
        const pathChanged = incoming.path !== undefined && incoming.path !== state.path;
        const scopeStateChanged = (incoming.running !== undefined && incoming.running !== state.running)
          || (incoming.outputChannels !== undefined && incoming.outputChannels !== state.outputChannels);
        if (pathChanged || savedViewState?.reset === true) scheduleScopeDraw(0, []);
        const supersededRestore = pathChanged && restoringViewState;
        if (supersededRestore) viewRestoreGeneration++;
        delete incoming.viewState;
        Object.assign(state, incoming);
        if (!state.running || !state.connected) activeVirtualMidiNotes.clear();
        if (scopeStateChanged) scheduleScopeDraw(latestScopeData.channels, latestScopeData.samples);
        if (pendingEventViewState && pendingEventViewState.path !== state.path) {
          pendingEventViewState = null;
          pendingEventSchemaReceived = false;
        }
        // Schema and connection may arrive together or in separate state updates.
        const eventSchemaReceived = Array.isArray(incoming.events);
        if (pendingEventViewState && eventSchemaReceived) {
          pendingEventSchemaReceived = true;
        }
        render();
        if (pathChanged && !savedViewState) {
          scrollNode.scrollTop = 0;
          logOutputNode.scrollTop = 0;
        }
        viewStateReady = true;
        if (savedViewState) restoreViewState(savedViewState, eventSchemaReceived);
        else if (pendingEventViewState && ((pendingEventSchemaReceived && state.connected
          && !isCompiling()) || state.error || state.status === "Stopped")) {
          restoreViewState(pendingEventViewState);
        } else if (supersededRestore) {
          const generation = viewRestoreGeneration;
          requestAnimationFrame(() => finishViewStateRestore(generation));
        } else if (hadViewState && incoming.resetEventArguments === true) {
          publishViewState();
        }
        if (!restoringViewState) {
          document.documentElement.removeAttribute("data-run-view-pending");
        }
      });

      // ---------------------------------------------------------------------------
      // Render
      // ---------------------------------------------------------------------------

      function logEntryContext(entry) {
        const source = entry && typeof entry.source === "object" ? entry.source : null;
        const file = source && typeof source.file === "string" ? source.file : "";
        const line = Number(source && source.line);
        const hasLine = Number.isSafeInteger(line) && line >= 0;
        const owner = entry && typeof entry.lexicalOwner === "string"
          ? entry.lexicalOwner
          : "";
        if (file && hasLine && owner) return file + ":" + line + " \u00b7 " + owner;
        if (file && hasLine) return file + ":" + line;
        return owner;
      }

      function renderLogLines(logText, entries) {
        const lines = logText.split("\n");
        if (lines[lines.length - 1] === "") lines.pop();
        const contexts = lines.map((_, index) => logEntryContext(entries[index]));
        const contentKey = logText + "\u0000" + contexts.join("\n");
        if (logOutputNode.__ondaLogContentKey === contentKey) return false;

        const fragment = document.createDocumentFragment();
        for (let index = 0; index < lines.length; index++) {
          const row = document.createElement("div");
          row.className = "log-line";
          const message = document.createElement("span");
          message.className = "log-message";
          message.textContent = lines[index];
          row.appendChild(message);
          if (contexts[index]) {
            const context = document.createElement("span");
            context.className = "log-context";
            context.textContent = contexts[index];
            context.title = contexts[index];
            row.appendChild(context);
          }
          fragment.appendChild(row);
        }
        logOutputNode.replaceChildren(fragment);
        logOutputNode.__ondaLogContentKey = contentKey;
        return true;
      }

      function renderEvents() {
        const shape = JSON.stringify([
          state.connected,
          state.events.map((event) => (event.args || []).map((arg) =>
            isArrayEventArg(arg) ? arg.value.length : null)),
        ]);
        if (renderedEvents === state.events && renderedEventShape === shape) return;
        const structuredOpenStates = new Map(
          [...eventsNode.querySelectorAll(".event-structured-arg")]
            .map(group => [group.dataset.foldKey, group.open]),
        );
        renderedEvents = state.events;
        renderedEventShape = shape;
        eventsNode.replaceChildren();
        if (state.events.length > 0) {
          for (const event of state.events) {
            const card = document.createElement("div");
            card.className = "param event-card";

            const eventHead = document.createElement("div");
            eventHead.className = "event-head";
            const head = document.createElement("div");
            head.className = "event-identity";
            head.innerHTML = '<div class="param-name"></div>';
            head.querySelector(".param-name").textContent = event.name;
            const argumentCount = Array.isArray(event.args) ? event.args.length : 0;
            head.title = event.name;

            const trigger = document.createElement("button");
            trigger.className = "event-trigger compact-action";
            trigger.textContent = "Trigger";
            const refreshTrigger = () => {
              // Numeric steps set keyboard increments; event parsing owns validity.
              trigger.disabled = !state.connected || [...controls.querySelectorAll("input, textarea")]
                .some(input => input.validity.customError);
            };
            eventHead.append(head, trigger);
            card.appendChild(eventHead);

            const controls = document.createElement("div");
            controls.className = "event-args";
            if (argumentCount > 0) card.appendChild(controls);

            for (const arg of event.args || []) {
              const structured = isStructuredEventArg(arg);
              const setting = document.createElement(structured ? "details" : "div");
              setting.className = structured
                ? "event-arg event-structured-arg"
                : "event-arg";

              const label = document.createElement(structured ? "summary" : "div");
              label.className = structured
                ? "event-arg-heading event-structured-heading"
                : "event-arg-heading";
              const argName = document.createElement("span");
              argName.className = "event-arg-name";
              argName.textContent = arg.name;
              const argType = document.createElement("span");
              argType.className = "event-arg-type";
              argType.textContent = arg.type;
              label.append(argName, argType);
              label.title = arg.name + ": " + arg.type;
              setting.appendChild(label);

              if (structured) {
                setting.dataset.foldKey = JSON.stringify([event.name, arg.name, arg.type]);
                setting.open = structuredOpenStates.get(setting.dataset.foldKey) ?? true;
                const input = document.createElement("textarea");
                input.className = "param-number";
                input.value = JSON.stringify(arg.value, null, 2);
                input.rows = structuredEventVisibleLines(input.value);
                input.disabled = !state.connected;
                input.setAttribute("aria-label", arg.name + " JSON value");
                input.addEventListener("input", () => {
                  input.rows = structuredEventVisibleLines(input.value);
                  try {
                    arg.value = JSON.parse(input.value);
                    input.setCustomValidity("");
                  } catch {
                    input.setCustomValidity("Enter a valid JSON value");
                  }
                  refreshTrigger();
                });
                setting.appendChild(input);
              } else if (isArrayEventArg(arg)) {
                setting.classList.add("event-array-arg");
                const arrayHead = document.createElement("div");
                arrayHead.className = "event-array-head";
                arrayHead.appendChild(label);

                const expectedLength = eventArrayLength(arg);
                if (!Array.isArray(arg.value)) arg.value = [];
                if (expectedLength !== null) {
                  arg.value = Array.from(
                    { length: expectedLength },
                    (_, index) => arg.value[index] ?? (eventArrayScalarType(arg) === "bool" ? false : 0),
                  );
                }

                const count = document.createElement("span");
                count.className = "event-array-count";
                count.textContent = arg.value.length === 1
                  ? "1 element"
                  : arg.value.length + " elements";
                arrayHead.appendChild(count);

                if (expectedLength === null) {
                  const actions = document.createElement("div");
                  actions.className = "event-array-actions";
                  const remove = document.createElement("button");
                  remove.className = "secondary event-array-action";
                  remove.textContent = "−";
                  remove.title = "Remove last element";
                  remove.setAttribute("aria-label", "Remove last element");
                  remove.disabled = !state.connected || arg.value.length === 0;
                  const add = document.createElement("button");
                  add.className = "secondary event-array-action";
                  add.textContent = "+";
                  add.title = "Add element";
                  add.setAttribute("aria-label", "Add element");
                  add.disabled = !state.connected || arg.value.length >= 16;
                  remove.addEventListener("click", () => {
                    arg.value.pop();
                    render();
                  });
                  add.addEventListener("click", () => {
                    const scalar = eventArrayScalarType(arg);
                    arg.value.push(eventScalarValue(scalar, 0));
                    render();
                  });
                  actions.append(remove, add);
                  arrayHead.appendChild(actions);
                }
                setting.appendChild(arrayHead);

                if (arg.value.length === 0) {
                  const note = document.createElement("div");
                  note.className = "event-array-note";
                  note.textContent = "No elements. Add one to build the event payload.";
                  setting.appendChild(note);
                } else {
                  const grid = document.createElement("div");
                  grid.className = "event-array-grid";
                  const scalarType = eventArrayScalarType(arg);
                  arg.value.slice(0, 16).forEach((value, index) => {
                    const element = document.createElement("div");
                    element.className = "event-array-element";
                    const elementIndex = document.createElement("span");
                    elementIndex.className = "event-array-index";
                    elementIndex.textContent = "[" + index + "]";
                    element.appendChild(elementIndex);

                    element.appendChild(createEventScalarControl(
                      scalarType,
                      value,
                      arg.default?.[index],
                      (nextValue) => { arg.value[index] = nextValue; },
                    ));
                    grid.appendChild(element);
                  });
                  setting.appendChild(grid);

                  if (arg.value.length > 16) {
                    const note = document.createElement("div");
                    note.className = "event-array-note";
                    note.textContent = (arg.value.length - 16)
                      + " additional elements are retained but not shown";
                    setting.appendChild(note);
                  }
                }
              } else {
                setting.appendChild(createEventScalarControl(
                  arg.type,
                  arg.value,
                  arg.default,
                  (nextValue) => { arg.value = nextValue; },
                ));
              }

              setting.addEventListener("input", refreshTrigger);
              setting.addEventListener("change", refreshTrigger);
              setting.addEventListener("focusout", refreshTrigger);
              for (const input of setting.querySelectorAll("input[data-draggable]")) {
                const index = input.closest(".event-array-element")?.querySelector(".event-array-index");
                input.setAttribute("aria-label", arg.name + (index ? " " + index.textContent : ""));
              }
              controls.appendChild(setting);
            }

            refreshTrigger();
            trigger.addEventListener("click", () => {
              hostBridge.postMessage({
                type: "triggerEvent",
                name: event.name,
                values: (event.args || []).map((arg) =>
                  (isStructuredEventArg(arg) || isArrayEventArg(arg))
                    ? arg.value
                    : eventScalarValue(arg.type, arg.value)
                ),
              });
            });

            eventsNode.appendChild(card);
          }
        }

      }

      function render() {
        const logWasAtBottom =
          logOutputNode.scrollHeight - logOutputNode.clientHeight - logOutputNode.scrollTop <= 1;
        applyTheme();
        smoothingControl.hidden = state.supportsParamSmoothing !== true;
        if (document.activeElement !== smoothingInput && !smoothingNumber.isDragging()) {
          smoothingInput.value = formatNumberForInput(state.paramSmoothingMs, 1);
        }
        const supportsSourceSelection = state.supportsSourceSelection === true;
        const supportsProjectExport = state.supportsProjectExport === true;
        const supportsBufferEmbedding = state.supportsBufferEmbedding === true;
        const supportsTransport = state.supportsTransport === true;
        const supportsDeviceSelection = state.supportsDeviceSelection === true;
        const supportsMidiInput = state.midi?.available === true;
        const supportsRunSettings = state.supportsRunSettings === true;
        const supportsScope = state.supportsScope === true;
        const hasSource = Boolean(state.path);
        filePickerNode.hidden = !supportsSourceSelection || hasSource;
        filePickerSettingsNode.hidden = !supportsRunSettings;
        runHeaderNode.hidden = supportsSourceSelection && !hasSource;
        const versionOwner = runHeaderNode.hidden ? filePickerBrandNode : heroBrandNode;
        if (ondaVersionNode.parentElement !== versionOwner) {
          versionOwner.append(ondaVersionNode);
        }
        unloadButton.hidden = !supportsSourceSelection;
        saveProjectButton.hidden = !supportsProjectExport || !hasSource;
        saveProjectButton.disabled = state.canExportProject !== true;
        pathNode.textContent = state.path
          ? state.path.split(/[\\/]/).pop() || state.path
          : "No file selected";
        pathNode.title = state.path || "";
        const status = state.connected
          ? state.status
          : state.running
          ? state.status + " (connecting controls...)"
          : state.status;
        statusNode.textContent = hasSource
          ? formatRunStatus(status, state.sampleRateHz, state.blockSamples)
          : status;
        statusNode.title = statusNode.textContent;
        errorNode.textContent = state.error || "";
        errorNode.style.display = state.error ? "block" : "none";
        filePickerErrorNode.textContent = state.error || "";
        filePickerErrorNode.style.display = state.error ? "block" : "none";
        selectRunSetting(
          runSampleRateNode,
          state.sampleRateHz,
          formatBufferSampleRate(state.sampleRateHz),
        );
        selectRunSetting(
          runBlockSizeNode,
          state.blockSamples,
          state.blockSamples + " samples",
        );
        scopeSection.style.display = supportsScope && hasSource ? "block" : "none";
        const hasBuffers = state.buffers.length > 0;
        const hasEvents = state.events.length > 0;
        const hasParams = state.params.length > 0;
        const canEditRun = canEditRunControls();
        buffersSection.style.display = hasBuffers ? "" : "none";
        bufferEmbeddingControl.hidden = !supportsBufferEmbedding || !hasBuffers;
        embedBuffersInput.checked = state.embedBuffers === true;
        embedBuffersLabel.textContent =
          state.embedBuffers === true && state.embeddedBuffersReady !== true
            ? "Embedding buffers..."
            : "Embed in DAW project";
        eventsSection.style.display = hasEvents ? "" : "none";
        logSection.style.display = state.logRevealed === true ? "" : "none";
        paramsSection.style.display = hasParams ? "" : "none";
        refreshDevicesButton.hidden = !supportsDeviceSelection && !supportsMidiInput;
        ioSettingsNode.hidden = !supportsDeviceSelection && !supportsMidiInput;
        ioSettingsNode.style.display = supportsDeviceSelection || supportsMidiInput ? "grid" : "none";
        inputDeviceNode.closest(".param-setting").hidden = !supportsDeviceSelection;
        outputDeviceNode.closest(".param-setting").hidden = !supportsDeviceSelection;
        midiInputSettingNode.hidden = !supportsMidiInput;
        settingsButton.hidden = !supportsDeviceSelection && !supportsMidiInput;
        utilityActionsNode.hidden = settingsButton.hidden && saveProjectButton.hidden && unloadButton.hidden;
        if (runHeaderNode.hidden || settingsButton.hidden) closeDeviceSettings();
        heroControlsNode.classList.toggle("has-transport", supportsTransport);
        const transportHadFocus = transportNode.contains(document.activeElement);
        transportNode.hidden = !supportsTransport;
        startButton.hidden = !supportsTransport || state.running;
        stopButton.hidden = !supportsTransport || !state.running;
        startButton.disabled = !state.path || state.running;
        stopButton.disabled = !state.running;
        if (transportHadFocus && supportsTransport) {
          const activeTransport = state.running ? stopButton : startButton;
          if (!activeTransport.disabled) activeTransport.focus({ preventScroll: true });
        }
        renderDeviceOptions(inputDeviceNode, state.inputDevices, state.currentInputDevice, true);
        renderDeviceOptions(outputDeviceNode, state.outputDevices, state.currentOutputDevice, true);
        renderDeviceOptions(
          midiInputDeviceNode,
          state.midiInputDevices,
          state.currentMidiInputDevice,
          supportsMidiInput,
          null,
        );
        const showMidiKeyboard = state.midi?.noteOn === true;
        midiKeyboardNode.hidden = !showMidiKeyboard;
        if (settingsPopover.matches(":popover-open")) positionDeviceSettings();
        const monitorOnly = state.midiKeyboardInteractive === false;
        midiKeyboardNode.classList.toggle("monitor-only", monitorOnly);
        setSectionOpen("midi", sectionState.midi);
        for (const key of pianoNode.children) key.tabIndex = monitorOnly ? -1 : 0;
        if (!showMidiKeyboard && virtualMidiSources.size > 0) releaseAllVirtualMidiNotes();
        updateMidiKeyboardLayout();
        updateHeaderLayout();

        buffersNode.replaceChildren();
        if (hasBuffers) {
          for (const buffer of state.buffers) {
            const card = document.createElement("div");
            card.className = "buffer-card";

            const head = document.createElement("div");
            head.className = "buffer-identity";
            head.innerHTML = '<div class="param-name"></div><div class="param-type"></div>';
            head.querySelector(".param-name").textContent = buffer.name;
            head.querySelector(".param-type").textContent = buffer.type;
            card.appendChild(head);

            const detail = document.createElement("div");
            detail.className = "buffer-detail";
            const loaded = document.createElement("div");
            loaded.className = "buffer-file";
            const isBound = Number.isInteger(Number(buffer.loadedFrames))
              && Number(buffer.loadedFrames) > 0;
            loaded.textContent = buffer.loadedPath
              ? bufferFileName(buffer.loadedPath)
              : isBound
                ? "Embedded project asset"
                : "No file bound";
            loaded.title = buffer.loadedPath || loaded.textContent;
            detail.appendChild(loaded);
            const metadata = loadedBufferSummary(buffer);
            if (metadata) {
              const summary = document.createElement("div");
              summary.className = "buffer-metadata";
              summary.textContent = metadata;
              detail.appendChild(summary);
            }
            card.appendChild(detail);

            const actions = document.createElement("div");
            actions.className = "buffer-actions";
            const choose = document.createElement("button");
            choose.className = "secondary compact-action";
            choose.textContent = isBound ? "Replace" : "Bind";
            choose.title = "Bind a WAV or .ondabuffer file";
            choose.disabled = !canEditRun;
            choose.addEventListener("click", () => {
              if (typeof hostBridge.chooseBufferFile === "function") {
                hostBridge.chooseBufferFile(buffer.name);
              } else {
                hostBridge.postMessage({ type: "chooseBufferFile", name: buffer.name });
              }
            });
            const clear = document.createElement("button");
            clear.className = "secondary compact-action";
            clear.textContent = "Clear";
            clear.hidden = !isBound;
            clear.disabled = !canEditRun || !isBound;
            clear.addEventListener("click", () => {
              hostBridge.postMessage({ type: "clearBuffer", name: buffer.name });
            });
            actions.append(choose, clear);
            card.appendChild(actions);

            buffersNode.appendChild(card);
            const waveform = bufferWaveform(buffer);
            if (waveform) {
              const preview = document.createElement("div");
              preview.className = "buffer-waveform";
              const canvas = document.createElement("canvas");
              canvas.setAttribute("role", "img");
              canvas.setAttribute("aria-label", bufferWaveformSummary(waveform));
              canvas.title = bufferWaveformSummary(waveform);
              canvas.__ondaBufferWaveform = waveform;
              preview.appendChild(canvas);
              card.appendChild(preview);
              drawBufferWaveform(canvas, waveform);
            }
          }
        }

        renderEvents();

        const logText = state.logText || "";
        const logEntries = Array.isArray(state.logEntries) ? state.logEntries : [];
        if (renderLogLines(logText, logEntries)) {
          if (logWasAtBottom) {
            logOutputNode.scrollTop = logOutputNode.scrollHeight;
          }
        }
        const generatedOverflow = Number(state.printOverflowCount || 0);
        const transportDrops = Number(state.printTransportDropCount || 0);
        const delegateOverflow = Number(state.delegateOverflowCount || 0);
        const delegateTransportDrops = Number(state.delegateTransportDropCount || 0);
        const losses = [];
        if (generatedOverflow || transportDrops) {
          losses.push("prints: " + generatedOverflow + " generated overflow · "
            + transportDrops + " transport drops");
        }
        if (delegateOverflow || delegateTransportDrops) {
          losses.push("delegates: " + delegateOverflow + " generated overflow · "
            + delegateTransportDrops + " transport drops");
        }
        logLossNode.style.display = losses.length > 0 ? "block" : "none";
        logLossNode.textContent = losses.join("\n");

        const paramSignature = paramRenderSignature(state.params);
        if (updateRenderedParams(state.params)) {
          return;
        }
        const arrayOpenStates = new Map(
          [...paramsNode.querySelectorAll(".param-array")]
            .map(group => [group.dataset.name, group.open]),
        );
        resetRenderedParams(paramSignature);
        const arrayContainers = new Map();
        for (const param of state.params) {
          let container = paramsNode;
          if (param.array) {
            const { name, length } = param.array;
            container = arrayContainers.get(name);
            if (!container) {
              const group = document.createElement("details");
              group.className = "param-array";
              group.dataset.name = name;
              group.open = arrayOpenStates.get(name) ?? true;
              const heading = document.createElement("summary");
              heading.className = "param-array-heading";
              heading.textContent = `${name} [${length}]`;
              container = document.createElement("div");
              container.className = "param-list";
              group.append(heading, container);
              paramsNode.appendChild(group);
              arrayContainers.set(name, container);
            }
          }
          const card = document.createElement("div");
          card.className = "param";

          const head = document.createElement("div");
          head.className = "param-head";
          head.innerHTML = '<div class="param-name"></div>';
          const displayName = paramDisplayName(param);
          const name = head.querySelector(".param-name");
          name.textContent = paramLabel(param);
          name.title = `${displayName} (${param.type})`;
          if (param.unit) {
            const unit = document.createElement("span");
            unit.className = "param-unit";
            unit.textContent = `(${param.unit})`;
            head.appendChild(unit);
          }
          const type = document.createElement("div");
          type.className = "param-type";
          type.textContent = param.type;
          head.appendChild(type);
          card.appendChild(head);

          const controls = document.createElement("div");
          controls.className = "param-controls";
          card.appendChild(controls);

          if (param.type === "bool") {
            card.classList.add("param-bool");
            const label = document.createElement("label");
            label.className = "param-toggle";
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = Boolean(param.value);
            input.disabled = !canEditRun;
            const text = document.createElement("span");
            text.textContent = input.checked ? "On" : "Off";
            input.addEventListener("change", () => {
              param.value = input.checked;
              text.textContent = input.checked ? "On" : "Off";
              hostBridge.postMessage({
                type: "setParam",
                name: param.name,
                value: input.checked,
                commit: true,
              });
            });
            label.append(input, text);
            controls.appendChild(label);
            paramBindings.set(param.name, {
              param,
              setValue(nextValue) {
                input.checked = Boolean(nextValue);
                text.textContent = input.checked ? "On" : "Off";
              },
            });
          } else {
            const hasRange = Number.isFinite(param.rangeMin) && Number.isFinite(param.rangeMax);
            card.classList.add(hasRange ? "param-ranged" : "param-unbounded");
            const stepValue = scalarStepForParam(param);
            const step = String(stepValue);
            const currentValue = typeof param.value === "number" ? param.value : 0;
            const number = document.createElement("input");
            number.className = "param-number";
            number.type = "number";
            number.step = step;
            number.value = formatNumberForInput(currentValue, stepValue);
            number.disabled = !canEditRun;
            controls.appendChild(number);
            let rangeControl;

            if (hasRange) {
              number.min = String(param.rangeMin);
              number.max = String(param.rangeMax);

              rangeControl = (
                paramLayout === "knobs" ? createKnobControl : createSliderControl
              )(
                param,
                currentValue,
                step,
                (nextValue) => {
                  activeParamGestures.add(param.name);
                  param.value = nextValue;
                  const nextText = formatNumberForInput(nextValue, stepValue);
                  number.value = nextText;
                  scheduleParamMessage(param.name, nextValue);
                },
                (nextValue) => {
                  activeParamGestures.delete(param.name);
                  param.value = nextValue;
                  const nextText = formatNumberForInput(nextValue, stepValue);
                  number.value = nextText;
                  commitParamMessage(param.name, nextValue);
                },
              );
              controls.prepend(rangeControl.control);
            }
            const sync = (nextValue) => {
              const parsed = Number(nextValue);
              if (!Number.isFinite(parsed)) return;
              const quantized = hasRange
                ? constrainParamPlain(param, parsed)
                : quantizeToStep(parsed, 0,
                  param.type === "i32" || param.type === "i64" ? stepValue : param.step);
              param.value = quantized;
              rangeControl?.setValue(quantized);
              number.value = formatNumberForInput(quantized, stepValue);
            };
            bindParamNumber(param, number, sync);
          }

          container.appendChild(card);
        }
      }

      // ---------------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------------

      function bufferFileName(path) {
        const parts = String(path).split(/[\\/]/);
        return parts[parts.length - 1] || String(path);
      }

      function loadedBufferSummary(buffer) {
        const frames = Number(buffer.loadedFrames);
        const channels = Number(buffer.loadedChannels);
        const sampleRate = Number(buffer.loadedSampleRate);
        if (
          !Number.isSafeInteger(frames) || frames < 0
          || !Number.isSafeInteger(channels) || channels <= 0
          || !Number.isFinite(sampleRate) || sampleRate <= 0
        ) {
          return "";
        }
        return frames.toLocaleString() + " frames \u00b7 "
          + channels + " ch \u00b7 " + formatBufferSampleRate(sampleRate);
      }

      function bufferWaveform(buffer) {
        const waveform = buffer && buffer.waveform;
        const minValue = Number(waveform && waveform.minValue);
        const maxValue = Number(waveform && waveform.maxValue);
        const minimums = waveform && waveform.minimums;
        const maximums = waveform && waveform.maximums;
        if (
          !Number.isFinite(minValue)
          || !Number.isFinite(maxValue)
          || !Array.isArray(minimums)
          || !Array.isArray(maximums)
          || minimums.length === 0
          || minimums.length !== maximums.length
        ) return null;
        return { minValue, maxValue, minimums, maximums };
      }

      function bufferWaveformScale(waveform) {
        return Math.max(1, Math.abs(waveform.minValue), Math.abs(waveform.maxValue));
      }

      function formatWaveformValue(value) {
        const magnitude = Math.abs(value);
        let rendered;
        if (Object.is(value, -0) || value === 0) {
          rendered = "0";
        } else if (magnitude >= 10_000 || magnitude < 0.001) {
          rendered = value.toExponential(2);
        } else {
          rendered = value.toFixed(3).replace(/\.?0+$/, "");
        }
        return rendered.replaceAll("-", "\u2212");
      }

      function bufferWaveformSummary(waveform) {
        return ("Minimum: " + waveform.minValue + "\nMaximum: " + waveform.maxValue)
          .replaceAll("-", "\u2212");
      }

      function drawBufferWaveform(canvas, waveform) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const cssWidth = rect.width || canvas.parentElement?.clientWidth || 600;
        const cssHeight = rect.height || 62;
        const width = Math.max(1, Math.round(cssWidth * dpr));
        const height = Math.max(1, Math.round(cssHeight * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const context = canvas.getContext("2d");
        const computed = getComputedStyle(document.documentElement);
        const gridColor = computed.getPropertyValue("--scope-grid").trim();
        const strokeColor = computed.getPropertyValue("--scope-1").trim();
        const textColor = computed.getPropertyValue("--muted").trim();
        const monoFont = computed.getPropertyValue("--mono-font").trim();
        context.clearRect(0, 0, width, height);

        const left = 42 * dpr;
        const right = width - 5 * dpr;
        const top = 5 * dpr;
        const bottom = height - 5 * dpr;
        const center = (top + bottom) / 2;
        const amplitude = (bottom - top) / 2;
        const scale = bufferWaveformScale(waveform);
        const snapToPixelCenter = coordinate => Math.floor(coordinate) + 0.5;
        const zeroY = snapToPixelCenter(center);
        const valueY = value => zeroY - value / scale * amplitude;
        const guideY = value => snapToPixelCenter(valueY(value));

        context.strokeStyle = gridColor;
        context.lineWidth = 1;
        context.setLineDash([]);
        context.save();
        context.globalAlpha = 0.4;
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(left, zeroY);
        context.lineTo(right, zeroY);
        context.stroke();
        context.restore();
        if (scale > 1 && Math.abs(guideY(1) - zeroY) >= 2) {
          context.setLineDash([2 * dpr, 2 * dpr]);
          for (const value of [-1, 1]) {
            const y = guideY(value);
            context.beginPath();
            context.moveTo(left, y);
            context.lineTo(right, y);
            context.stroke();
          }
          context.setLineDash([]);
        }

        context.strokeStyle = strokeColor;
        context.lineWidth = Math.max(1, 1.25 * dpr);
        const plotWidth = Math.max(1, right - left);
        const columns = waveform.minimums.length;
        const bucketX = index => snapToPixelCenter(
          left + plotWidth * (index + 0.5) / columns
        );
        const sampleY = value => snapToPixelCenter(
          valueY(Math.max(-scale, Math.min(scale, value)))
        );
        context.beginPath();
        for (let index = 0; index < columns; index++) {
          const minimum = Number(waveform.minimums[index]);
          const maximum = Number(waveform.maximums[index]);
          if (!Number.isFinite(minimum) || !Number.isFinite(maximum)) continue;
          const x = bucketX(index);
          const maximumY = maximum > 0 ? sampleY(maximum) : zeroY;
          const minimumY = minimum < 0 ? sampleY(minimum) : zeroY;
          context.moveTo(x, maximumY);
          context.lineTo(x, minimumY);
        }
        context.stroke();

        context.fillStyle = strokeColor;
        context.beginPath();
        const markerRadius = 0.75 * dpr;
        for (let index = 0; index < columns; index++) {
          const minimum = Number(waveform.minimums[index]);
          const maximum = Number(waveform.maximums[index]);
          if (!Number.isFinite(minimum) || !Number.isFinite(maximum)) continue;
          const x = bucketX(index);
          const maximumY = sampleY(maximum);
          context.moveTo(x + markerRadius, maximumY);
          context.arc(x, maximumY, markerRadius, 0, 2 * Math.PI);
          if (minimum !== maximum) {
            const minimumY = sampleY(minimum);
            context.moveTo(x + markerRadius, minimumY);
            context.arc(x, minimumY, markerRadius, 0, 2 * Math.PI);
          }
        }
        context.fill();

        context.fillStyle = textColor;
        context.font = `${9.5 * dpr}px ${monoFont}`;
        context.textAlign = "right";
        for (const [value, y, baseline] of [
          [scale, top, "top"],
          [0, center, "middle"],
          [-scale, bottom, "bottom"],
        ]) {
          context.textBaseline = baseline;
          context.fillText(formatWaveformValue(value), left - 4 * dpr, y);
        }
      }

      function drawVisibleBufferWaveforms() {
        for (const canvas of buffersNode.querySelectorAll(".buffer-waveform canvas")) {
          if (canvas.__ondaBufferWaveform) {
            drawBufferWaveform(canvas, canvas.__ondaBufferWaveform);
          }
        }
      }

      function formatBufferSampleRate(sampleRate) {
        if (sampleRate < 1_000) return Math.round(sampleRate) + " Hz";
        const khz = sampleRate / 1_000;
        return (Number.isInteger(khz) ? khz.toFixed(0) : khz.toFixed(1)) + " kHz";
      }

      function formatRunStatus(status, sampleRate, blockSamples) {
        if (
          !Number.isFinite(sampleRate)
          || sampleRate <= 0
          || !Number.isInteger(blockSamples)
          || blockSamples <= 0
        ) return status;
        return status
          + " \u2014 " + formatBufferSampleRate(sampleRate)
          + " \u00b7 " + blockSamples + " samples";
      }

      function selectRunSetting(select, value, label) {
        if (!Number.isFinite(value) || value <= 0) return;
        const stringValue = String(value);
        let option = [...select.options].find(candidate => candidate.value === stringValue);
        if (!option) {
          option = document.createElement("option");
          option.value = stringValue;
          option.textContent = label;
          option.dataset.custom = "true";
          select.appendChild(option);
        }
        select.value = stringValue;
      }

      function renderDeviceOptions(node, devices, selected, enabled, defaultLabel = "Default") {
        if (!node) {
          return;
        }
        node.replaceChildren();
        if (defaultLabel !== null) {
          const defaultOption = document.createElement("option");
          defaultOption.value = "";
          defaultOption.textContent = defaultLabel;
          node.appendChild(defaultOption);
        }
        for (const device of devices || []) {
          const option = document.createElement("option");
          option.value = device;
          option.textContent = device;
          node.appendChild(option);
        }
        node.value = selected || node.options[0]?.value || "";
        node.disabled = !enabled;
      }

      if (mediaThemeQuery && typeof mediaThemeQuery.addEventListener === "function") {
        mediaThemeQuery.addEventListener("change", () => {
          if (bridgeThemePreference === "auto") {
            applyTheme();
          }
        });
      } else if (mediaThemeQuery && typeof mediaThemeQuery.addListener === "function") {
        mediaThemeQuery.addListener(() => {
          if (bridgeThemePreference === "auto") {
            applyTheme();
          }
        });
      }

      setupCollapsibleSections();
      setupParamLayoutToggle();
      setupMidiVelocityNumber();
      new ResizeObserver(updateMidiKeyboardLayout).observe(midiKeyboardNode);
      new ResizeObserver(([entry]) => {
        const size = entry.devicePixelContentBoxSize?.[0];
        scopePixelSize = size
          ? { width: size.inlineSize, height: size.blockSize }
          : null;
        scheduleScopeDraw(latestScopeData.channels, latestScopeData.samples);
      }).observe(scopeCanvas, { box: "device-pixel-content-box" });
      window.addEventListener("resize", () => {
        updateMidiKeyboardLayout();
        window.requestAnimationFrame(drawVisibleBufferWaveforms);
        scheduleScopeDraw(latestScopeData.channels, latestScopeData.samples);
      });
      applyTheme();
      render();
    </script>
  </body>
</html>
