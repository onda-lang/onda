<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onda Run</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #081522;
        --panel: #0c1e33;
        --panel-strong: #122134;
        --panel-soft: #16273d;
        --text: #d8e5f3;
        --muted: #92a8bf;
        --accent: #c9dbf2;
        --accent-strong: #e0ebfa;
        --accent-soft: #233d5c;
        --border: #354e6d;
        --danger: #ff7e7e;
        --button-text: #08111d;
        --field-bg: #0d1827;
        --scope-bg: #0a1624;
        --scope-grid: rgba(201, 219, 242, 0.14);
        --scope-1: #c9dbf2;
        --scope-2: #7bade6;
        --scope-3: #7ad7ba;
        --scope-4: #f3b57b;
        --scrollbar-track: #081522;
        --scrollbar-thumb: #2d5278;
        --scrollbar-thumb-hover: #47739f;
        --piano-bed: #081522;
        --piano-white-top: #c4d3e4;
        --piano-white-bottom: #9fb5cc;
        --piano-white-hover-top: #d9e6f4;
        --piano-white-hover-bottom: #b8cbe0;
        --piano-white-active-top: #8db8e7;
        --piano-white-active-bottom: #5e91ca;
        --piano-black-top: #14283e;
        --piano-black-bottom: #09131f;
        --piano-black-hover-top: #21405f;
        --piano-black-hover-bottom: #10283f;
        --piano-black-active-top: #90bce9;
        --piano-black-active-bottom: #5f91c9;
        --piano-key-border: #354e6d;
        --shadow: 0 20px 60px rgba(3, 10, 18, 0.34);
        --mono-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* Shared with the native view: controls 5, groups 8, cards 9, sections 12. */
        --radius-control: 5px;
        --radius-group: 8px;
        --radius-card: 9px;
        --radius-section: 12px;
        --radius-window: 14px;
        --radius-round: 999px;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #e8f1fc;
        --panel: #f5f9ff;
        --panel-strong: #f4f9ff;
        --panel-soft: #eaf2fb;
        --text: #143a63;
        --muted: #4e6a86;
        --accent: #143a63;
        --accent-strong: #0a213b;
        --accent-soft: #dbe8f7;
        --border: #bed1e5;
        --danger: #b53333;
        --button-text: #edf4fb;
        --field-bg: #ffffff;
        --scope-bg: #ecf4fd;
        --scope-grid: rgba(20, 58, 99, 0.12);
        --scope-1: #143a63;
        --scope-2: #2f76c5;
        --scope-3: #21956e;
        --scope-4: #bf7925;
        --scrollbar-track: #e8f1fc;
        --scrollbar-thumb: #9bb8d8;
        --scrollbar-thumb-hover: #6f94ba;
        --piano-bed: #dbe8f7;
        --piano-white-top: #ffffff;
        --piano-white-bottom: #e7eff8;
        --piano-white-hover-top: #f8fbff;
        --piano-white-hover-bottom: #dbe8f7;
        --piano-white-active-top: #b9d3ef;
        --piano-white-active-bottom: #8eb4dc;
        --piano-black-top: #214b73;
        --piano-black-bottom: #102b48;
        --piano-black-hover-top: #2f638f;
        --piano-black-hover-bottom: #173f65;
        --piano-black-active-top: #4f8ccd;
        --piano-black-active-bottom: #275f9b;
        --piano-key-border: #91aac5;
        --shadow: 0 18px 44px rgba(76, 109, 145, 0.18);
      }

      * {
        box-sizing: border-box;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        scrollbar-width: thin;
      }
      html {
        height: 100%;
        min-height: 100%;
        scrollbar-width: auto;
        background: var(--bg);
      }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      html::-webkit-scrollbar { width: 12px; height: 12px; }
      *::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      *::-webkit-scrollbar-thumb {
        border: 2px solid var(--scrollbar-track);
        border-radius: var(--radius-round);
        background: var(--scrollbar-thumb);
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
      *::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        width: 100%;
        margin: 0 auto;
        padding: 18px;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .file-picker {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 36px);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius-window);
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .file-picker-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        max-width: 380px;
      }

      .file-picker-logo {
        width: 76px;
        height: 76px;
      }

      .file-picker-copy {
        color: var(--muted);
      }

      .file-picker-settings {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
        margin-top: 4px;
        text-align: left;
      }

      .file-picker-settings .param-setting-label {
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      .header, .buffers, .events, .params, .scope-section {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-section);
        padding: 14px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .hero {
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
        min-height: 176px;
      }

      .hero-logo {
        width: 68px;
        height: 68px;
        display: block;
      }

      .hero-rule {
        width: 100%;
        height: 1px;
        background: var(--border);
        opacity: 0.9;
      }

      .title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .meta {
        color: var(--muted);
        word-break: break-word;
        font: 13px/1.45 var(--mono-font);
      }

      .status {
        color: var(--accent);
        font-weight: 600;
      }

      .error {
        padding: 10px 12px;
        border-radius: var(--radius-card);
        border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
        background: color-mix(in srgb, var(--panel-strong) 84%, black 16%);
        color: var(--danger);
        font: 12px/1.45 var(--mono-font);
        white-space: pre-wrap;
        word-break: break-word;
        display: none;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .io-settings {
        display: none;
        grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
        align-items: end;
        gap: 10px;
      }

      .io-settings.midi-only {
        grid-template-columns: minmax(0, 180px) auto;
        justify-content: center;
      }

      .refresh-devices {
        white-space: nowrap;
        padding-inline: 12px;
      }

      @media (max-width: 430px) {
        .io-settings {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .refresh-devices {
          grid-column: 1 / -1;
          justify-self: center;
        }
      }

      button {
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        padding: 8px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      button.primary {
        background: var(--accent);
        color: var(--button-text);
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.secondary {
        background: var(--accent-soft);
        color: var(--text);
        border-color: var(--border);
      }

      button.event-trigger {
        background: transparent;
        color: var(--accent);
        border-color: var(--border);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);
      }

      button.event-trigger:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border-color: var(--accent);
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .params-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      .params-toolbar {
        align-items: center;
        width: 100%;
      }

      .section-heading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-right: auto;
      }

      .param-layout-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      .param-layout-toggle button {
        min-height: 28px;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }

      .param-layout-toggle button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--text);
      }

      .section-toggle {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        width: auto;
        min-width: 14px;
        padding: 0;
        margin: 0;
        background: transparent;
        border: 0;
        color: inherit;
        text-align: left;
      }

      .section-toggle:hover:not(:disabled) {
        background: transparent;
      }

      .section-toggle::before {
        content: "▾";
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        transition: transform 120ms ease;
      }

      .section-toggle[aria-expanded="false"]::before {
        transform: rotate(-90deg);
      }

      .section-body {
        margin-top: 12px;
      }

      .section-body[hidden] {
        display: none !important;
      }

      .buffers-list {
        display: grid;
        gap: 6px;
      }

      .buffer-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 3px 10px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 7px 8px 7px 10px;
      }

      .buffer-identity {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
        white-space: nowrap;
      }

      .buffer-identity .param-name {
        flex: 0 1 auto;
        max-width: 55%;
      }

      .buffer-identity .param-type {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .buffer-detail {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .buffer-file {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font: 12px/1.4 var(--mono-font);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .buffer-metadata {
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--muted);
        font-family: var(--mono-font);
        font-size: 11px;
        white-space: nowrap;
      }

      .buffer-waveform {
        grid-column: 1 / -1;
        min-width: 0;
        margin-top: 3px;
      }

      .buffer-waveform canvas {
        display: block;
        width: 100%;
        height: 62px;
        border-radius: 6px;
        background: var(--scope-bg);
      }

      .buffer-actions {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        gap: 5px;
      }

      #buffers {
        gap: 3px;
      }

      .buffer-actions .compact-action {
        min-height: 28px;
        padding: 3px 8px;
      }

      .compact-action {
        min-height: 30px;
        padding: 4px 9px;
        border-radius: var(--radius-control);
        font-size: 12px;
      }

      .param.event-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 0;
        overflow: hidden;
      }

      #events {
        gap: 3px;
      }

      .event-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 11px;
      }

      .event-identity {
        display: flex;
        flex: 1;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
      }

      .event-identity .param-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-summary {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .event-args {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
        padding: 9px 11px 11px;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 72%, var(--bg));
      }

      .event-arg {
        display: grid;
        grid-template-columns: minmax(7rem, 1fr) minmax(7rem, 10rem);
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .event-arg-heading {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }

      .event-arg-name {
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-arg-type {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .event-arg > .param-number {
        width: 100%;
        min-height: 30px;
        padding: 4px 7px;
        border-radius: var(--radius-control);
      }

      .event-arg > .param-toggle {
        justify-self: end;
        min-height: 30px;
        padding: 0 3px;
      }

      .event-array-arg {
        display: block;
        padding: 0;
      }

      .event-array-head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .event-array-count {
        color: var(--muted);
        font-size: 11px;
      }

      .event-array-actions {
        display: flex;
        gap: 5px;
        margin-left: auto;
      }

      .event-array-action {
        width: 25px;
        min-height: 25px;
        padding: 2px;
        border-radius: var(--radius-control);
        font-size: 11px;
      }

      .event-array-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
        gap: 7px;
        margin-top: 6px;
        padding: 7px;
        border-radius: var(--radius-group);
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .event-array-element {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        padding: 6px 7px 7px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--bg);
      }

      .event-array-index {
        flex: 0 0 1.65rem;
        color: var(--muted);
        font: 10px/1.2 var(--mono-font);
      }

      .event-array-element .param-number {
        width: 100%;
        min-width: 0;
        min-height: 28px;
        padding: 3px 6px;
        border-radius: var(--radius-control);
      }

      .event-array-element .param-toggle {
        min-height: 28px;
      }

      .event-array-note {
        margin-top: 6px;
        padding: 8px 9px;
        border-radius: var(--radius-group);
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--muted);
        font-size: 11px;
      }

      .event-empty {
        color: var(--muted);
        font-size: 12px;
      }

      .params-title {
        font-size: 14px;
        font-weight: 700;
      }

      .params-subtitle {
        color: var(--muted);
      }

      .param-list {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, 200px), 1fr)
        );
        gap: 8px;
      }

      .param {
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 12px;
      }

      .param-head {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        flex-wrap: nowrap;
        gap: 6px;
        min-width: 0;
      }

      .param-name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .param-type {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }

      .param-name,
      .param-type,
      .event-arg-name,
      .event-arg-type {
        font-family: var(--mono-font);
      }

      .param-setting {
        display: grid;
        gap: 6px;
      }

      .param-setting-label {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .midi-keyboard {
        position: relative;
        z-index: 5;
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        padding: 14px 18px 18px;
        border: 0;
        border-top: 1px solid var(--border);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 0 -12px 36px rgba(3, 10, 18, 0.24);
        backdrop-filter: blur(8px);
      }

      .midi-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 9px;
      }

      .midi-keyboard.monitor-only .midi-toolbar {
        display: none;
      }

      .midi-keyboard.monitor-only .piano-key {
        cursor: default;
        pointer-events: none;
      }

      .midi-toolbar .params-title {
        margin-right: auto;
      }

      .midi-control {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .midi-control input[type="number"] {
        width: 56px;
      }

      .midi-control input[type="range"] {
        width: 120px;
      }

      .piano {
        position: relative;
        display: grid;
        grid-template-columns: repeat(14, minmax(22px, 1fr));
        height: 112px;
        overflow: hidden;
        border: 1px solid var(--piano-key-border);
        border-radius: var(--radius-group);
        background: var(--piano-bed);
        box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent);
        touch-action: none;
        user-select: none;
      }

      .piano-key {
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 1px solid var(--piano-key-border);
        border-radius: 0 0 3px 3px;
        cursor: pointer;
        touch-action: none;
        transition: filter 100ms ease;
      }

      .piano-key:focus-visible {
        z-index: 3;
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }

      .piano-key.white {
        background: linear-gradient(
          to bottom,
          var(--piano-white-top),
          var(--piano-white-bottom)
        );
        box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--piano-bed) 24%, transparent);
      }

      .piano-key.white:hover:not(.active) {
        background: linear-gradient(
          to bottom,
          var(--piano-white-hover-top),
          var(--piano-white-hover-bottom)
        );
      }

      .piano-key.white.active {
        background: linear-gradient(
          to bottom,
          var(--piano-white-active-top),
          var(--piano-white-active-bottom)
        );
      }

      .piano-key.black {
        position: absolute;
        z-index: 2;
        top: 0;
        width: calc((100% / 14) * 0.62);
        height: 63%;
        transform: translateX(-50%);
        border-color: var(--piano-key-border);
        background: linear-gradient(
          to bottom,
          var(--piano-black-top),
          var(--piano-black-bottom)
        );
        box-shadow: 0 4px 7px rgba(3, 10, 18, 0.42);
      }

      .piano-key.black:hover:not(.active) {
        background: linear-gradient(
          to bottom,
          var(--piano-black-hover-top),
          var(--piano-black-hover-bottom)
        );
      }

      .piano-key.black.active {
        background: linear-gradient(
          to bottom,
          var(--piano-black-active-top),
          var(--piano-black-active-bottom)
        );
      }

      .param-controls {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      /* Keep these card dimensions aligned with onda_egui::param_grid_columns. */
      #params[data-layout="sliders"] .param {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(88px, 104px);
        grid-template-rows: 26px 24px;
        grid-template-areas:
          "heading value"
          "control control";
        align-content: center;
        gap: 4px 8px;
        min-width: 0;
        height: 80px;
        padding: 8px 9px;
      }

      #params[data-layout="sliders"] .param-head {
        grid-area: heading;
        min-width: 0;
        align-self: center;
      }

      #params[data-layout="sliders"] .param-controls {
        display: contents;
      }

      #params[data-layout="sliders"] .param-slider {
        grid-area: control;
        align-self: center;
      }

      #params[data-layout="sliders"] .param-number {
        grid-area: value;
        align-self: center;
        height: 26px;

      // ---------------------------------------------------------------------------
      // Host bridge abstraction
      // ---------------------------------------------------------------------------
      // The host environment injects `window.__hostBridge` before this script runs.
      //
      // VS Code host sets:
      //   window.__hostBridge = { mode: "vscode" }
      //   (uses acquireVsCodeApi().postMessage / window message events)
      //
      // wry (native) host sets:
      //   window.__hostBridge = { mode: "wry" }
      //   (uses window.ipc.postMessage / window._onHostMessage callback)
      //
      // Browser playground host sets:
      //   window.__hostBridge = { mode: "browser" }
      //   (uses structured parent/iframe postMessage envelopes)
      //
      // If no bridge is injected we auto-detect VS Code by trying acquireVsCodeApi.
      // ---------------------------------------------------------------------------

      const hostBridge = (function () {
        const cfg = window.__hostBridge || {};
        const mode = cfg.mode || "auto";

        // --- VS Code path ---
        if (mode === "vscode" || (mode === "auto" && typeof acquireVsCodeApi === "function")) {
          const vscode = acquireVsCodeApi();
          return {
            mode: "vscode",
            postMessage(msg) { vscode.postMessage(msg); },
            onMessage(callback) {
              window.addEventListener("message", (event) => {
                if (event.data) callback(event.data);
              });
            },
          };
        }

        // --- browser iframe path ---
        if (mode === "browser" || (mode === "auto" && window.parent !== window)) {
          const targetOrigin = cfg.targetOrigin || window.location.origin;
          return {
            mode: "browser",
            postMessage(msg) {
              window.parent.postMessage({ __ondaRunWebview: true, message: msg }, targetOrigin);
            },
            chooseBufferFile(name) {
              const input = document.createElement("input");
              input.type = "file";
              input.accept = ".wav,.ondabuffer,audio/wav,audio/x-wav,application/vnd.onda.buffer";
              input.hidden = true;

              let settled = false;
              const cleanup = () => {
                if (settled) return;
                settled = true;
                window.removeEventListener("focus", cleanupAfterCancel);
                input.remove();
              };
              const cleanupAfterCancel = () => {
                setTimeout(() => {
                  if (!input.files?.length) cleanup();
                }, 0);
              };

              input.addEventListener("change", () => {
                const file = input.files && input.files[0];
                if (file) {
                  window.parent.postMessage({
                    __ondaRunWebview: true,
                    message: { type: "bindBufferFile", name, file },
                  }, targetOrigin);
                }
                cleanup();
              }, { once: true });
              input.addEventListener("cancel", cleanup, { once: true });
              window.addEventListener("focus", cleanupAfterCancel, { once: true });
              document.body.appendChild(input);
              input.click();
            },
            onMessage(callback) {
              window.addEventListener("message", (event) => {
                if (
                  event.source !== window.parent
                  || event.origin !== targetOrigin
                  || !event.data?.__ondaRunHost
                ) return;
                callback(event.data.message);
              });
            },
          };
        }

        return {
          mode: "wry",
          postMessage(msg) {
            if (window.ipc && window.ipc.postMessage) {
              window.ipc.postMessage(JSON.stringify(msg));
            }
          },
          onMessage(callback) {
            window._onHostMessage = callback;

      });
      outputDeviceNode.addEventListener("change", () => {

      });

          type: "setMidiInputDevice",
