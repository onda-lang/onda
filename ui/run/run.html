    <script>
      // ---------------------------------------------------------------------------
      // Host bridge abstraction
      // ---------------------------------------------------------------------------
      // The host environment injects `window.__hostBridge` before this script runs.
      //
      // VS Code host sets:
      //   window.__hostBridge = { mode: "vscode" }
      //   (uses acquireVsCodeApi().postMessage / window message events)
      //
      // wry (native) host sets:
      //   window.__hostBridge = { mode: "wry" }
      //   (uses window.ipc.postMessage / window._onHostMessage callback)
      //
      // Browser playground host sets:
      //   window.__hostBridge = { mode: "browser" }
      //   (uses structured parent/iframe postMessage envelopes)
      //
      // If no bridge is injected we auto-detect VS Code by trying acquireVsCodeApi.
      // ---------------------------------------------------------------------------

      const hostBridge = (function () {
        const cfg = window.__hostBridge || {};
        const mode = cfg.mode || "auto";

        // --- VS Code path ---
        if (mode === "vscode" || (mode === "auto" && typeof acquireVsCodeApi === "function")) {
          const vscode = acquireVsCodeApi();
          return {
            mode: "vscode",
            postMessage(msg) { vscode.postMessage(msg); },
            onMessage(callback) {
              window.addEventListener("message", (event) => {
                if (event.data) callback(event.data);
              });
            },
          };
        }

        // --- browser iframe path ---
        if (mode === "browser" || (mode === "auto" && window.parent !== window)) {
          const targetOrigin = cfg.targetOrigin || window.location.origin;
          return {
            mode: "browser",
            postMessage(msg) {
              window.parent.postMessage({ __ondaRunWebview: true, message: msg }, targetOrigin);
            },
            chooseBufferFile(name) {
              const input = document.createElement("input");
              input.type = "file";
              input.accept = ".wav,audio/wav,audio/x-wav";
              input.hidden = true;

              let settled = false;
              const cleanup = () => {
                if (settled) return;
                settled = true;
                window.removeEventListener("focus", cleanupAfterCancel);
                input.remove();
              };
              const cleanupAfterCancel = () => {
                setTimeout(() => {
                  if (!input.files?.length) cleanup();
                }, 0);
              };

              input.addEventListener("change", () => {
                const file = input.files && input.files[0];
                if (file) {
                  window.parent.postMessage({
                    __ondaRunWebview: true,
                    message: { type: "bindBufferFile", name, file },
                  }, targetOrigin);
                }
                cleanup();
              }, { once: true });
              input.addEventListener("cancel", cleanup, { once: true });
              window.addEventListener("focus", cleanupAfterCancel, { once: true });
              document.body.appendChild(input);
              input.click();
            },
            onMessage(callback) {
              window.addEventListener("message", (event) => {
                if (
                  event.source !== window.parent
                  || event.origin !== targetOrigin
                  || !event.data?.__ondaRunHost
                ) return;
                callback(event.data.message);
              });
            },
          };
        }

        // --- wry (native window) path ---
        return {
          mode: "wry",
          postMessage(msg) {
            if (window.ipc && window.ipc.postMessage) {
              window.ipc.postMessage(JSON.stringify(msg));
            }
          },
          onMessage(callback) {
            window._onHostMessage = callback;
          },
        };
      })();

      // ---------------------------------------------------------------------------
      // State and DOM refs
      // ---------------------------------------------------------------------------

      const THEME_LOGOS = {
        dark: toSvgDataUri(`
          <svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
            <title id="title">Onda logo dark variant</title>
            <rect width="512" height="512" fill="#0C1E33"/>
            <g transform="translate(256 256) scale(1.30) translate(-256 -256)">
              <circle cx="256" cy="256" r="156" stroke="#C9DBF2" stroke-width="24"/>
              <path
                d="M167 256C188 253 198 214 225 214C257 214 255 298 287 298C314 298 324 259 345 256"
                stroke="#C9DBF2"
                stroke-width="22"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
        `),
        light: toSvgDataUri(`
          <svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
            <title id="title">Onda logo concept</title>
            <rect width="512" height="512" fill="#F5F9FF"/>
            <g transform="translate(256 256) scale(1.30) translate(-256 -256)">
              <circle cx="256" cy="256" r="156" stroke="#143A63" stroke-width="24"/>
              <path
                d="M167 256C188 253 198 214 225 214C257 214 255 298 287 298C314 298 324 259 345 256"
                stroke="#143A63"
                stroke-width="22"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
        `),
      };
      const state = {
        running: false,
        connected: false,
        path: "",
        status: "Stopped",
        error: "",
        sourceDirty: false,
        buffers: [],
        events: [],
        params: [],
        inputDevices: [],
        outputDevices: [],
        currentInputDevice: null,
        currentOutputDevice: null,
        supportsSourceSelection: false,
        supportsTransport: false,
        supportsDeviceSelection: false,
        supportsRunSettings: false,
        supportsReset: false,
        supportsScope: false,
        sampleRateHz: 48_000,
        blockFrames: 256,
      };

      const startButton = document.getElementById("start");
      const stopButton = document.getElementById("stop");
      const resetButton = document.getElementById("reset");
      const refreshDevicesButton = document.getElementById("refresh-devices");
      const unloadButton = document.getElementById("unload");
      const chooseOndaFileButton = document.getElementById("choose-onda-file");
      const filePickerNode = document.getElementById("file-picker");
      const filePickerSettingsNode = document.getElementById("file-picker-settings");
      const filePickerErrorNode = document.getElementById("file-picker-error");
      const runSampleRateNode = document.getElementById("run-sample-rate");
      const runBlockSizeNode = document.getElementById("run-block-size");
      const runHeaderNode = document.getElementById("run-header");
      const pathNode = document.getElementById("path");
      const statusNode = document.getElementById("status");
      const errorNode = document.getElementById("error");
      const ioSettingsNode = document.getElementById("io-settings");
      const inputDeviceNode = document.getElementById("input-device");
      const outputDeviceNode = document.getElementById("output-device");
      refreshDevicesButton.hidden = !state.supportsDeviceSelection;
      ioSettingsNode.hidden = !state.supportsDeviceSelection;
      const buffersSection = document.getElementById("buffers-section");
      const buffersNode = document.getElementById("buffers");
      const eventsSection = document.getElementById("events-section");
      const eventsNode = document.getElementById("events");
      const paramsSection = document.getElementById("params-section");
      const paramsNode = document.getElementById("params");
      const scopeSection = document.getElementById("scope-section");
      const scopeToggle = document.getElementById("scope-toggle");
      const scopeBody = document.getElementById("scope-body");
      const scopeCanvas = document.getElementById("scope-canvas");
      const scopeCtx = scopeCanvas.getContext("2d");
      const buffersToggle = document.getElementById("buffers-toggle");
      const buffersBody = document.getElementById("buffers-body");
      const eventsToggle = document.getElementById("events-toggle");
      const eventsBody = document.getElementById("events-body");
      const paramsToggle = document.getElementById("params-toggle");
      const paramsBody = document.getElementById("params-body");
      const paramLayoutButtons = [...document.querySelectorAll("[data-param-layout]")];
      const logoNode = document.getElementById("hero-logo");
      const filePickerLogoNode = document.getElementById("file-picker-logo");
      const PARAM_LAYOUT_STORAGE_KEY = "onda.run-view.param-layout.v1";
      const pendingParamMessages = new Map();
      const activeParamGestures = new Set();
      const paramBindings = new Map();
      let pendingParamFrame = 0;
      let renderedParamSignature = "";
      let pendingScopeFrame = 0;
      let latestScopeData = { channels: 0, samples: [] };
      let currentTheme = "";
      const sectionState = {
        scope: true,
        buffers: true,
        events: true,
        params: true,
      };
      let paramLayout = restoreParamLayout();

      let bridgeThemePreference =
        typeof window.__ondaForcedTheme === "string" && window.__ondaForcedTheme
          ? window.__ondaForcedTheme
          : window.__hostBridge && typeof window.__hostBridge.theme === "string"
          ? window.__hostBridge.theme
          : "auto";
      const mediaThemeQuery =
        typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-color-scheme: light)")
          : null;

      // ---------------------------------------------------------------------------
      // Host communication
      // ---------------------------------------------------------------------------

      hostBridge.postMessage({ type: "webviewReady" });
      window.addEventListener("load", () => {
        hostBridge.postMessage({ type: "webviewReady" });
      });

      startButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "start", path: state.path || undefined });
      });
      stopButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "stop" });
      });
      resetButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "reset" });
      });
      refreshDevicesButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "refreshDevices" });
      });
      chooseOndaFileButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "chooseOndaFile" });
      });
      const updateRunSettings = () => {
        hostBridge.postMessage({
          type: "setRunSettings",
          sampleRateHz: Number(runSampleRateNode.value),
          blockFrames: Number(runBlockSizeNode.value),
        });
      };
      runSampleRateNode.addEventListener("change", updateRunSettings);
      runBlockSizeNode.addEventListener("change", updateRunSettings);
      unloadButton.addEventListener("click", () => {
        hostBridge.postMessage({ type: "unload" });
      });
      inputDeviceNode.addEventListener("change", () => {
        hostBridge.postMessage({ type: "setInputDevice", name: inputDeviceNode.value || null });
      });
      outputDeviceNode.addEventListener("change", () => {
        hostBridge.postMessage({ type: "setOutputDevice", name: outputDeviceNode.value || null });
      });
      document.addEventListener("keydown", (event) => {
        if (
          !state.supportsTransport
          || event.isComposing
          || event.altKey
          || (!event.ctrlKey && !event.metaKey)
        ) return;
        const run = event.key === "Enter";
        const stop = event.key === "." || event.code === "Period";
        if (!run && !stop) return;
        event.preventDefault();
        if (event.repeat) return;
        if (run && startButton.disabled) return;
        if (stop && stopButton.disabled) return;
        hostBridge.postMessage(run
          ? { type: "start", path: state.path || undefined }
          : { type: "stop" });
      }, { capture: true });

      // ---------------------------------------------------------------------------
      // Scope rendering
      // ---------------------------------------------------------------------------

      function drawScope(channels, samples) {
        const dpr = window.devicePixelRatio || 1;
        const rect = scopeCanvas.getBoundingClientRect();
        const w = Math.round(rect.width * dpr);
        const h = Math.round(rect.height * dpr);
        if (scopeCanvas.width !== w || scopeCanvas.height !== h) {
          scopeCanvas.width = w;
          scopeCanvas.height = h;
        }
        scopeCtx.clearRect(0, 0, w, h);
        if (channels === 0 || samples.length === 0) {
          return;
        }
        const frames = Math.floor(samples.length / channels);
        if (frames === 0) {
          return;
        }

        const computed = getComputedStyle(document.documentElement);
        const gridColor = computed.getPropertyValue("--scope-grid").trim();
        const chHeight = h / channels;
        for (let ch = 0; ch < channels; ch++) {
          const yCenter = chHeight * ch + chHeight / 2;
          const amplitude = chHeight / 2 * 0.85;
          const color = computed.getPropertyValue("--scope-1").trim();

          scopeCtx.strokeStyle = gridColor;
          scopeCtx.lineWidth = 1;
          scopeCtx.beginPath();
          scopeCtx.moveTo(0, yCenter);
          scopeCtx.lineTo(w, yCenter);
          scopeCtx.stroke();

          scopeCtx.strokeStyle = color;
          scopeCtx.lineWidth = 1.5 * dpr;
          scopeCtx.beginPath();
          for (let i = 0; i < w; i++) {
            const frameIdx = Math.floor(i * frames / w);
            const sample = samples[frameIdx * channels + ch];
            const clamped = Math.max(-1, Math.min(1, sample));
            const y = yCenter - clamped * amplitude;
            if (i === 0) {
              scopeCtx.moveTo(i, y);
            } else {
              scopeCtx.lineTo(i, y);
            }
          }
          scopeCtx.stroke();
        }
      }

      function scheduleScopeDraw(channels, samples) {
        latestScopeData = { channels, samples };
        if (pendingScopeFrame !== 0) {
          return;
        }
        pendingScopeFrame = window.requestAnimationFrame(() => {
          pendingScopeFrame = 0;
          drawScope(latestScopeData.channels, latestScopeData.samples);
        });
      }

      function toSvgDataUri(svg) {
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg.trim());
      }

      function resolvedTheme() {
        if (bridgeThemePreference === "dark") {
          return "dark";
        }
        if (bridgeThemePreference === "light") {
          return "light";
        }
        return mediaThemeQuery && mediaThemeQuery.matches ? "light" : "dark";
      }

      function applyTheme() {
        const nextTheme = resolvedTheme();
        document.documentElement.dataset.theme = nextTheme;
        document.body.dataset.theme = nextTheme;
        if (currentTheme === nextTheme) {
          return;
        }
        currentTheme = nextTheme;
        if (logoNode) {
          logoNode.src = THEME_LOGOS[nextTheme];
        }
        if (filePickerLogoNode) {
          filePickerLogoNode.src = THEME_LOGOS[nextTheme];
        }
        scheduleScopeDraw(latestScopeData.channels, latestScopeData.samples);
      }

      function setSectionOpen(name, isOpen) {
        sectionState[name] = isOpen;
        const toggle = {
          scope: scopeToggle,
          buffers: buffersToggle,
          events: eventsToggle,
          params: paramsToggle,
        }[name];
        const body = {
          scope: scopeBody,
          buffers: buffersBody,
          events: eventsBody,
          params: paramsBody,
        }[name];
        if (toggle) {
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        }
        if (body) {
          body.hidden = !isOpen;
        }
      }

      function setupCollapsibleSections() {
        [
          ["scope", scopeToggle],
          ["buffers", buffersToggle],
          ["events", eventsToggle],
          ["params", paramsToggle],
        ].forEach(([name, toggle]) => {
          if (!toggle) {
            return;
          }
          toggle.addEventListener("click", () => {
            setSectionOpen(name, !sectionState[name]);
          });
          setSectionOpen(name, sectionState[name]);
        });
      }

      function restoreParamLayout() {
        try {
          return localStorage.getItem(PARAM_LAYOUT_STORAGE_KEY) === "knobs"
            ? "knobs"
            : "sliders";
        } catch {
          return "sliders";
        }
      }

      function setParamLayout(layout, persist = true) {
        paramLayout = layout === "knobs" ? "knobs" : "sliders";
        applyParamLayout();
        if (persist) {
          try {
            localStorage.setItem(PARAM_LAYOUT_STORAGE_KEY, paramLayout);
          } catch {
            // The layout still applies for this view when storage is disabled.
          }
        }
        render();
      }

      function applyParamLayout() {
        paramsNode.dataset.layout = paramLayout;
        for (const button of paramLayoutButtons) {
          button.setAttribute(
            "aria-pressed",
            button.dataset.paramLayout === paramLayout ? "true" : "false",
          );
        }
      }

      function setupParamLayoutToggle() {
        for (const button of paramLayoutButtons) {
          button.addEventListener("click", () => {
            if (button.dataset.paramLayout !== paramLayout) {
              setParamLayout(button.dataset.paramLayout);
            }
          });
        }
        applyParamLayout();
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function decimalPlaces(step) {
        const [coefficient, exponentText] = String(step).toLowerCase().split("e");
        const fractionDigits = coefficient.split(".")[1]?.length ?? 0;
        const exponent = exponentText === undefined ? 0 : Number(exponentText);
        return Math.max(0, fractionDigits - exponent);
      }

      const FLOAT_CONTROL_TARGET_STEPS = 2000;
      const FLOAT_CONTROL_MIN_STEP = 0.0001;
      const FLOAT_CONTROL_MAX_STEP = 0.1;

      function scalarStepForParam(param) {
        // Keep this host policy aligned with onda_egui::scalar_step.
        const declaredStep = Number(param.step);
        if (Number.isFinite(declaredStep) && declaredStep > 0) {
          return declaredStep;
        }
        if (param.type === "i32" || param.type === "i64") {
          return 1;
        }
        const min = Number(param.rangeMin);
        const max = Number(param.rangeMax);
        if (Number.isFinite(min) && Number.isFinite(max)) {
          const span = Math.abs(max - min);
          if (Number.isFinite(span) && span > 0) {
            const rawStep = Math.max(
              span / FLOAT_CONTROL_TARGET_STEPS,
              FLOAT_CONTROL_MIN_STEP,
            );
            const exponent = Math.floor(Math.log10(rawStep));
            return Math.min(Math.pow(10, exponent), FLOAT_CONTROL_MAX_STEP);
          }
        }
        return 0.001;
      }

      function formatNumberForInput(value, step) {
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) {
          return "0";
        }
        const places = decimalPlaces(step);
        if (places > 8) {
          return String(numericValue);
        }
        if (places === 0) {
          return String(Math.round(numericValue));
        }
        return numericValue
          .toFixed(places)
          .replace(/\.?0+$/, "");
      }

      function quantizeToStep(value, min, step) {
        if (!Number.isFinite(step) || step <= 0) {
          return value;
        }
        return min + Math.round((value - min) / step) * step;
      }

      const paramControlCache = new WeakMap();

      function paramControl(param) {
        let control = paramControlCache.get(param);
        if (control) return control;
        control = globalThis.__ONDA_PARAM_CONTROL_V2__.createParamDomain({
          name: param.name,
          scalar: param.type,
          minimum: param.rangeMin,
          maximum: param.rangeMax,
          scale: param.scale,
          curve: param.curve,
          unit: param.unit,
          step: param.step,
          stepCount: param.stepCount,
        });
        paramControlCache.set(param, control);
        return control;
      }

      function paramPlainToNormalized(param, value) {
        return paramControl(param).plainToNormalized(value);
      }

      function constrainParamPlain(param, value) {
        return paramControl(param).constrainPlain(value);
      }

      function paramNormalizedToPlain(param, normalized) {
        return paramControl(param).normalizedToPlain(normalized);
      }

      function canEditRunControls() {
        return Boolean(state.path);
      }

      function createRangeValueController({
        currentValue,
        constrainValue,
        renderValue,
        onInputValue,
        onCommitValue,
      }) {
        let value = constrainValue(currentValue);

        const update = (nextValue, notify) => {
          value = constrainValue(nextValue);
          renderValue(value);
          if (notify === "input") onInputValue(value);
          if (notify === "commit") onCommitValue(value);
        };

        return {
          get value() { return value; },
          input(nextValue) { update(nextValue, "input"); },
          commit(nextValue) { update(nextValue, "commit"); },
          setValue(nextValue) { update(nextValue); },
          render() { renderValue(value); },
        };
      }

      function bindRangeControlKeys(control, controller, param, step) {
        const min = Number(param.rangeMin);
        const max = Number(param.rangeMax);
        control.addEventListener("keydown", (event) => {
          let nextValue;
          if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
            nextValue = controller.value - step;
          } else if (event.key === "ArrowRight" || event.key === "ArrowUp") {
            nextValue = controller.value + step;
          } else if (event.key === "Home") {
            nextValue = min;
          } else if (event.key === "End") {
            nextValue = max;
          } else {
            return;
          }
          event.preventDefault();
          controller.commit(nextValue);
        });
        control.addEventListener("dblclick", (event) => {
          event.preventDefault();
          controller.commit(initialParamValue(param));
        });
      }

      function initializeRangeControl(control, param) {
        const canEdit = canEditRunControls();
        control.tabIndex = canEdit ? 0 : -1;
        control.setAttribute("role", "slider");
        control.setAttribute("aria-label", paramDisplayName(param));
        control.setAttribute("aria-valuemin", String(param.rangeMin));
        control.setAttribute("aria-valuemax", String(param.rangeMax));
        control.setAttribute("aria-disabled", canEdit ? "false" : "true");
        return canEdit;
      }

      function createSliderControl(param, currentValue, step, onInputValue, onCommitValue) {
        const slider = document.createElement("div");
        slider.className = "param-slider";
        const canEdit = initializeRangeControl(slider, param);

        const track = document.createElement("div");
        track.className = "param-slider-track";
        const fill = document.createElement("div");
        fill.className = "param-slider-fill";
        const thumb = document.createElement("div");
        thumb.className = "param-slider-thumb";
        track.append(fill, thumb);
        slider.appendChild(track);

        const controller = createRangeValueController({
          currentValue,
          constrainValue: (value) => constrainParamPlain(param, value),
          renderValue: (value) => {
            const ratio = paramPlainToNormalized(param, value);
            const pct = clamp(ratio, 0, 1) * 100;
            fill.style.width = pct + "%";
            thumb.style.left = pct + "%";
            slider.setAttribute("aria-valuenow", String(value));
            slider.dataset.value = String(value);
          },
          onInputValue,
          onCommitValue,
        });

        const setFromClientX = (clientX, commit) => {
          const rect = track.getBoundingClientRect();
          if (rect.width <= 0) {
            return;
          }
          const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
          const rawValue = paramNormalizedToPlain(param, ratio);
          if (commit) controller.commit(rawValue);
          else controller.input(rawValue);
        };

        if (canEdit) {
          slider.addEventListener("pointerdown", (event) => {
            slider.setPointerCapture(event.pointerId);
            setFromClientX(event.clientX, false);

            const onMove = (moveEvent) => {
              if (moveEvent.pointerId !== event.pointerId) {
                return;
              }
              setFromClientX(moveEvent.clientX, false);
            };

            const onEnd = (endEvent) => {
              if (endEvent.pointerId !== event.pointerId) {
                return;
              }
              slider.removeEventListener("pointermove", onMove);
              slider.removeEventListener("pointerup", onEnd);
              slider.removeEventListener("pointercancel", onEnd);
              setFromClientX(endEvent.clientX, true);
              if (slider.hasPointerCapture(event.pointerId)) {
                slider.releasePointerCapture(event.pointerId);
              }
            };

            slider.addEventListener("pointermove", onMove);
            slider.addEventListener("pointerup", onEnd);
            slider.addEventListener("pointercancel", onEnd);
          });

          bindRangeControlKeys(slider, controller, param, Number(step));
        }

        controller.render();
        return { control: slider, setValue: controller.setValue };
      }

      function createKnobControl(param, currentValue, step, onInputValue, onCommitValue) {
        const knob = document.createElement("div");
        knob.className = "param-knob";
        knob.title = "Drag vertically to adjust; double-click to reset";
        const canEdit = initializeRangeControl(knob, param);

        const dial = document.createElement("div");
        dial.className = "param-knob-dial";
        const indicator = document.createElement("div");
        indicator.className = "param-knob-indicator";
        dial.appendChild(indicator);
        knob.appendChild(dial);

        const controller = createRangeValueController({
          currentValue,
          constrainValue: (value) => constrainParamPlain(param, value),
          renderValue: (value) => {
            const ratio = paramPlainToNormalized(param, value);
            dial.style.setProperty("--knob-angle", `${ratio * 270}deg`);
            dial.style.setProperty("--knob-rotation", `${-135 + ratio * 270}deg`);
            knob.setAttribute("aria-valuenow", String(value));
            knob.dataset.value = String(value);
          },
          onInputValue,
          onCommitValue,
        });

        if (canEdit) {
          knob.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            knob.setPointerCapture(event.pointerId);
            const startY = event.clientY;
            const startNormalized = paramPlainToNormalized(param, controller.value);

            const onMove = (moveEvent) => {
              if (moveEvent.pointerId !== event.pointerId) return;
              controller.input(paramNormalizedToPlain(
                param,
                startNormalized + (startY - moveEvent.clientY) / 160,
              ));
            };

            const onEnd = (endEvent) => {
              if (endEvent.pointerId !== event.pointerId) return;
              knob.removeEventListener("pointermove", onMove);
              knob.removeEventListener("pointerup", onEnd);
              knob.removeEventListener("pointercancel", onEnd);
              controller.commit(controller.value);
              if (knob.hasPointerCapture(event.pointerId)) {
                knob.releasePointerCapture(event.pointerId);
              }
            };

            knob.addEventListener("pointermove", onMove);
            knob.addEventListener("pointerup", onEnd);
            knob.addEventListener("pointercancel", onEnd);
          });
          bindRangeControlKeys(knob, controller, param, Number(step));
        }

        controller.render();
        return { control: knob, setValue: controller.setValue };
      }

      function flushPendingParamMessages() {
        pendingParamFrame = 0;
        if (pendingParamMessages.size === 0) {
          return;
        }
        for (const [name, value] of pendingParamMessages.entries()) {
          hostBridge.postMessage({ type: "setParam", name, value, commit: false });
        }
        pendingParamMessages.clear();
      }

      function scheduleParamMessage(name, value) {
        pendingParamMessages.set(name, value);
        if (pendingParamFrame !== 0) {
          return;
        }
        pendingParamFrame = window.requestAnimationFrame(flushPendingParamMessages);
      }

      function commitParamMessage(name, value) {
        pendingParamMessages.delete(name);
        hostBridge.postMessage({ type: "setParam", name, value, commit: true });
      }

      // ---------------------------------------------------------------------------
      // Param hydration
      // ---------------------------------------------------------------------------
      // Ensures every param has `value` filled in from its metadata when the
      // host does not provide it. This is the single code path used by both
      // VS Code and the native window.

      function initialParamValue(param) {
        if (param.type === "bool") {
          if (param.default === null || param.default === undefined) {
            return false;
          }
          return param.default !== 0;
        }
        if (param.default !== null && param.default !== undefined) {
          return param.default;
        }
        if (param.rangeMin !== null && param.rangeMin !== undefined) {
          return param.rangeMin;
        }
        return 0;
      }

      function hydrateParams(params) {
        if (!Array.isArray(params)) return [];
        return params
          .filter(function (p) { return p.scalar !== false; })
          .map(function (p) {
            return Object.assign({}, p, {
              value: (p.value !== undefined && p.value !== null) ? p.value : initialParamValue(p),
            });
          });
      }

      function paramRenderSignature(params) {
        return JSON.stringify([
          paramLayout,
          canEditRunControls(),
          params.map((param) => [
            param.name,
            param.label,
            param.type,
            param.default,
            param.rangeMin,
            param.rangeMax,
            param.scale,
            param.curve,
            param.unit,
            param.step,
            param.stepCount,
          ]),
        ]);
      }

      function paramDisplayName(param) {
        const label = typeof param.label === "string" && param.label
          ? param.label
          : param.name;
        return param.unit ? `${label} (${param.unit})` : label;
      }

      function updateRenderedParams(params) {
        const signature = paramRenderSignature(params);
        if (signature !== renderedParamSignature) {
          return false;
        }

        for (const incoming of params) {
          if (!paramBindings.has(incoming.name)) {
            return false;
          }
        }

        for (let index = 0; index < params.length; index += 1) {
          const incoming = params[index];
          const binding = paramBindings.get(incoming.name);
          const localValue = binding.param.value;
          Object.assign(binding.param, incoming);
          if (activeParamGestures.has(incoming.name)) {
            binding.param.value = localValue;
          } else {
            binding.setValue(incoming.value);
          }
          params[index] = binding.param;
        }
        return true;
      }

      function resetRenderedParams(signature) {
        for (const name of activeParamGestures) {
          const binding = paramBindings.get(name);
          if (binding) {
            commitParamMessage(name, binding.param.value);
          }
        }
        activeParamGestures.clear();
        paramBindings.clear();
        paramsNode.replaceChildren();
        renderedParamSignature = signature;
      }

      function initialEventArgValue(arg) {
        if (isArrayEventArg(arg)) {
          return Array.isArray(arg.default) ? arg.default.slice() : [];
        }
        if (arg.default !== null && arg.default !== undefined) {
          if (arg.type === "bool") {
            return Boolean(arg.default);
          }
          const defaultValue = Number(arg.default);
          return Number.isFinite(defaultValue) ? defaultValue : 0;
        }
        if (arg.type === "bool") {
          if (arg.value !== null && arg.value !== undefined) {
            return arg.value !== 0;
          }
          return false;
        }
        if (arg.value !== null && arg.value !== undefined) {
          const value = Number(arg.value);
          return Number.isFinite(value) ? value : 0;
        }
        return 0;
      }

      function hydrateEvents(events, existingEvents) {
        if (!Array.isArray(events)) return [];
        const previousEvents = Array.isArray(existingEvents) ? existingEvents : [];
        return events.map(function (event) {
          const previous = previousEvents.find(function (item) {
            return item && item.name === event.name;
          });
          const previousArgs = Array.isArray(previous && previous.args) ? previous.args : [];
          return Object.assign({}, event, {
            args: Array.isArray(event.args) ? event.args.map(function (arg, index) {
              const previousArg = previousArgs.find(function (item) {
                return item && item.name === arg.name;
              }) || previousArgs[index];
              const rawValue = arg.value !== undefined && arg.value !== null
                ? arg.value
                : previousArg && previousArg.value !== undefined && previousArg.value !== null
                  ? previousArg.value
                  : undefined;
              const value = rawValue !== undefined && rawValue !== null
                ? rawValue
                : initialEventArgValue(arg);
              return Object.assign({}, arg, {
                value: isArrayEventArg(arg)
                  ? (Array.isArray(value) ? value : [])
                  : arg.type === "bool"
                    ? Boolean(value)
                    : (Number.isFinite(Number(value)) ? Number(value) : 0),
              });
            }) : [],
          });
        });
      }

      function isArrayEventArg(arg) {
        return Boolean(arg && (
          arg.isSlice
          || (typeof arg.arrayLength === "number" && arg.arrayLength !== 1)
          || (typeof arg.type === "string" && /\[[0-9]*\]$/.test(arg.type))
        ));
      }

      function eventArrayLength(arg) {
        if (arg.isSlice) return null;
        if (Number.isInteger(arg.arrayLength)) return arg.arrayLength;
        const match = typeof arg.type === "string" && arg.type.match(/\[([0-9]*)\]$/);
        return match && match[1] !== "" ? Number(match[1]) : null;
      }

      function eventArrayScalarType(arg) {
        return arg.scalar || String(arg.type || "").split("[", 1)[0];
      }

      function createEventScalarControl(type, value, onChange) {
        if (type === "bool") {
          const toggle = document.createElement("label");
          toggle.className = "param-toggle";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(value);
          input.disabled = !state.connected;
          const text = document.createElement("span");
          text.textContent = input.checked ? "On" : "Off";
          input.addEventListener("change", () => {
            onChange(input.checked);
            text.textContent = input.checked ? "On" : "Off";
          });
          toggle.append(input, text);
          return toggle;
        }

        const number = document.createElement("input");
        number.className = "param-number";
        number.type = "number";
        const integer = type === "i32" || type === "i64";
        number.step = integer ? "1" : "0.001";
        number.value = String(typeof value === "number" ? value : 0);
        number.disabled = !state.connected;
        const parsedValue = () => {
          const nextValue = Number(number.value);
          if (!Number.isFinite(nextValue)) return null;
          return integer ? Math.round(nextValue) : nextValue;
        };
        number.addEventListener("input", () => {
          const nextValue = parsedValue();
          if (nextValue !== null) onChange(nextValue);
        });
        number.addEventListener("change", () => {
          const nextValue = parsedValue() ?? 0;
          onChange(nextValue);
          number.value = String(nextValue);
        });
        return number;
      }

      // ---------------------------------------------------------------------------
      // Message handler
      // ---------------------------------------------------------------------------

      hostBridge.onMessage((message) => {
        if (!message) {
          return;
        }
        if (message.type === "scopeData") {
          scheduleScopeDraw(message.channels, message.samples);
          return;
        }
        if (message.type !== "state") {
          return;
        }
        const incoming = message.state || {};
        if (typeof incoming.themeMode === "string" && incoming.themeMode) {
          bridgeThemePreference = incoming.themeMode;
        }
        // Hydrate params with defaults if the host did not already do so.
        if (incoming.params) {
          incoming.params = hydrateParams(incoming.params);
        }
        if (incoming.events) {
          incoming.events = hydrateEvents(incoming.events, state.events);
        }
        Object.assign(state, incoming);
        render();
      });

      // ---------------------------------------------------------------------------
      // Render
      // ---------------------------------------------------------------------------

      function render() {
        applyTheme();
        const supportsSourceSelection = state.supportsSourceSelection === true;
        const supportsTransport = state.supportsTransport === true;
        const supportsDeviceSelection = state.supportsDeviceSelection === true;
        const supportsRunSettings = state.supportsRunSettings === true;
        const supportsReset = state.supportsReset === true;
        const supportsScope = state.supportsScope === true;
        const hasSource = Boolean(state.path);
        filePickerNode.hidden = !supportsSourceSelection || hasSource;
        filePickerSettingsNode.hidden = !supportsRunSettings;
        runHeaderNode.hidden = supportsSourceSelection && !hasSource;
        unloadButton.hidden = !supportsSourceSelection;
        pathNode.textContent = state.path ? state.path : "No file selected";
        const status = state.connected
          ? state.status
          : state.running
          ? state.status + " (connecting controls...)"
          : state.status;
        statusNode.textContent = hasSource
          ? formatRunStatus(status, state.sampleRateHz, state.blockFrames)
          : status;
        errorNode.textContent = state.error || "";
        errorNode.style.display = state.error ? "block" : "none";
        filePickerErrorNode.textContent = state.error || "";
        filePickerErrorNode.style.display = state.error ? "block" : "none";
        selectRunSetting(
          runSampleRateNode,
          state.sampleRateHz,
          formatBufferSampleRate(state.sampleRateHz),
        );
        selectRunSetting(
          runBlockSizeNode,
          state.blockFrames,
          state.blockFrames + " frames",
        );
        scopeSection.style.display = supportsScope && state.running ? "block" : "none";
        const hasBuffers = state.buffers.length > 0;
        const hasEvents = state.events.length > 0;
        const hasParams = state.params.length > 0;
        const canEditRun = canEditRunControls();
        buffersSection.style.display = hasBuffers ? "" : "none";
        eventsSection.style.display = hasEvents ? "" : "none";
        paramsSection.style.display = hasParams ? "" : "none";
        refreshDevicesButton.hidden = !supportsDeviceSelection;
        ioSettingsNode.hidden = !supportsDeviceSelection;
        ioSettingsNode.style.display = supportsDeviceSelection ? "grid" : "none";
        const buffersReady = state.buffers.every(buffer => Boolean(buffer.loadedPath));
        const canStart = buffersReady || Boolean(state.sourceDirty);
        startButton.hidden = !supportsTransport;
        stopButton.hidden = !supportsTransport;
        resetButton.hidden = !supportsReset;
        startButton.disabled = !state.path || state.running || !canStart;
        stopButton.disabled = !state.running;
        resetButton.disabled = !hasSource;
        renderDeviceOptions(inputDeviceNode, state.inputDevices, state.currentInputDevice, true);
        renderDeviceOptions(outputDeviceNode, state.outputDevices, state.currentOutputDevice, true);

        buffersNode.replaceChildren();
        if (hasBuffers) {
          for (const buffer of state.buffers) {
            const card = document.createElement("div");
            card.className = "buffer-card";

            const head = document.createElement("div");
            head.className = "buffer-identity";
            head.innerHTML = '<div class="param-name"></div><div class="param-type"></div>';
            head.querySelector(".param-name").textContent = buffer.name;
            head.querySelector(".param-type").textContent = buffer.type;
            card.appendChild(head);

            const detail = document.createElement("div");
            detail.className = "buffer-detail";
            const loaded = document.createElement("div");
            loaded.className = "buffer-file";
            loaded.textContent = buffer.loadedPath
              ? bufferFileName(buffer.loadedPath)
              : "No file bound";
            loaded.title = buffer.loadedPath || loaded.textContent;
            detail.appendChild(loaded);
            const metadata = loadedBufferSummary(buffer);
            if (metadata) {
              const summary = document.createElement("div");
              summary.className = "buffer-metadata";
              summary.textContent = metadata;
              detail.appendChild(summary);
            }
            card.appendChild(detail);

            const actions = document.createElement("div");
            actions.className = "buffer-actions";
            const choose = document.createElement("button");
            choose.className = "secondary compact-action";
            choose.textContent = buffer.loadedPath ? "Replace" : "Bind";
            choose.title = "Bind a WAV file";
            choose.disabled = !canEditRun;
            choose.addEventListener("click", () => {
              if (typeof hostBridge.chooseBufferFile === "function") {
                hostBridge.chooseBufferFile(buffer.name);
              } else {
                hostBridge.postMessage({ type: "chooseBufferFile", name: buffer.name });
              }
            });
            const clear = document.createElement("button");
            clear.className = "secondary compact-action";
            clear.textContent = "Clear";
            clear.hidden = !buffer.loadedPath;
            clear.disabled = !canEditRun || !buffer.loadedPath;
            clear.addEventListener("click", () => {
              hostBridge.postMessage({ type: "clearBuffer", name: buffer.name });
            });
            actions.append(choose, clear);
            card.appendChild(actions);

            buffersNode.appendChild(card);
          }
        }

        eventsNode.replaceChildren();
        if (hasEvents) {
          for (const event of state.events) {
            const card = document.createElement("div");
            card.className = "param event-card";

            const eventHead = document.createElement("div");
            eventHead.className = "event-head";
            const head = document.createElement("div");
            head.className = "event-identity";
            head.innerHTML = '<div class="param-name"></div><div class="event-summary"></div>';
            head.querySelector(".param-name").textContent = event.name;
            const argumentCount = Array.isArray(event.args) ? event.args.length : 0;
            head.querySelector(".event-summary").textContent = argumentCount === 0
              ? "No arguments"
              : argumentCount === 1
                ? "1 argument"
                : argumentCount + " arguments";
            head.title = event.name;

            const trigger = document.createElement("button");
            trigger.className = "event-trigger compact-action";
            trigger.textContent = "Trigger";
            const refreshTrigger = () => {
              trigger.disabled = !state.connected;
            };
            eventHead.append(head, trigger);
            card.appendChild(eventHead);

            const controls = document.createElement("div");
            controls.className = "event-args";
            if (argumentCount > 0) card.appendChild(controls);

            for (const arg of event.args || []) {
              const setting = document.createElement("div");
              setting.className = "event-arg";

              const label = document.createElement("div");
              label.className = "event-arg-heading";
              const argName = document.createElement("span");
              argName.className = "event-arg-name";
              argName.textContent = arg.name;
              const argType = document.createElement("span");
              argType.className = "event-arg-type";
              argType.textContent = arg.type;
              label.append(argName, argType);
              label.title = arg.name + ": " + arg.type;
              setting.appendChild(label);

              if (isArrayEventArg(arg)) {
                setting.classList.add("event-array-arg");
                const arrayHead = document.createElement("div");
                arrayHead.className = "event-array-head";
                arrayHead.appendChild(label);

                const expectedLength = eventArrayLength(arg);
                if (!Array.isArray(arg.value)) arg.value = [];
                if (expectedLength !== null) {
                  arg.value = Array.from(
                    { length: expectedLength },
                    (_, index) => arg.value[index] ?? (eventArrayScalarType(arg) === "bool" ? false : 0),
                  );
                }

                const count = document.createElement("span");
                count.className = "event-array-count";
                count.textContent = arg.value.length === 1
                  ? "1 element"
                  : arg.value.length + " elements";
                arrayHead.appendChild(count);

                if (expectedLength === null) {
                  const actions = document.createElement("div");
                  actions.className = "event-array-actions";
                  const remove = document.createElement("button");
                  remove.className = "secondary event-array-action";
                  remove.textContent = "−";
                  remove.title = "Remove last element";
                  remove.setAttribute("aria-label", "Remove last element");
                  remove.disabled = !state.connected || arg.value.length === 0;
                  const add = document.createElement("button");
                  add.className = "secondary event-array-action";
                  add.textContent = "+";
                  add.title = "Add element";
                  add.setAttribute("aria-label", "Add element");
                  add.disabled = !state.connected || arg.value.length >= 16;
                  remove.addEventListener("click", () => {
                    arg.value.pop();
                    render();
                  });
                  add.addEventListener("click", () => {
                    arg.value.push(eventArrayScalarType(arg) === "bool" ? false : 0);
                    render();
                  });
                  actions.append(remove, add);
                  arrayHead.appendChild(actions);
                }
                setting.appendChild(arrayHead);

                if (arg.value.length === 0) {
                  const note = document.createElement("div");
                  note.className = "event-array-note";
                  note.textContent = "No elements. Add one to build the event payload.";
                  setting.appendChild(note);
                } else {
                  const grid = document.createElement("div");
                  grid.className = "event-array-grid";
                  const scalarType = eventArrayScalarType(arg);
                  arg.value.slice(0, 16).forEach((value, index) => {
                    const element = document.createElement("label");
                    element.className = "event-array-element";
                    const elementIndex = document.createElement("span");
                    elementIndex.className = "event-array-index";
                    elementIndex.textContent = "[" + index + "]";
                    element.appendChild(elementIndex);

                    element.appendChild(createEventScalarControl(
                      scalarType,
                      value,
                      (nextValue) => { arg.value[index] = nextValue; },
                    ));
                    grid.appendChild(element);
                  });
                  setting.appendChild(grid);

                  if (arg.value.length > 16) {
                    const note = document.createElement("div");
                    note.className = "event-array-note";
                    note.textContent = (arg.value.length - 16)
                      + " additional elements are retained but not shown";
                    setting.appendChild(note);
                  }
                }
              } else {
                setting.appendChild(createEventScalarControl(
                  arg.type,
                  arg.value,
                  (nextValue) => { arg.value = nextValue; },
                ));
              }

              controls.appendChild(setting);
            }

            refreshTrigger();
            trigger.addEventListener("click", () => {
              hostBridge.postMessage({
                type: "triggerEvent",
                name: event.name,
                values: (event.args || []).map((arg) =>
                  isArrayEventArg(arg)
                    ? arg.value
                    : arg.type === "bool"
                      ? Boolean(arg.value)
                      : Number(arg.value)
                ),
              });
            });

            eventsNode.appendChild(card);
          }
        }

        const paramSignature = paramRenderSignature(state.params);
        if (updateRenderedParams(state.params)) {
          return;
        }
        resetRenderedParams(paramSignature);
        for (const param of state.params) {
          const card = document.createElement("div");
          card.className = "param";

          const head = document.createElement("div");
          head.className = "param-head";
          head.innerHTML = '<div class="param-name"></div><div class="param-type"></div>';
          const displayName = paramDisplayName(param);
          const name = head.querySelector(".param-name");
          name.textContent = displayName;
          name.title = displayName;
          head.querySelector(".param-type").textContent = param.type;
          card.appendChild(head);

          const controls = document.createElement("div");
          controls.className = "param-controls";
          card.appendChild(controls);

          if (param.type === "bool") {
            card.classList.add("param-bool");
            const label = document.createElement("label");
            label.className = "param-toggle";
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = Boolean(param.value);
            input.disabled = !canEditRun;
            const text = document.createElement("span");
            text.textContent = input.checked ? "On" : "Off";
            input.addEventListener("change", () => {
              param.value = input.checked;
              text.textContent = input.checked ? "On" : "Off";
              hostBridge.postMessage({
                type: "setParam",
                name: param.name,
                value: input.checked,
                commit: true,
              });
            });
            label.append(input, text);
            controls.appendChild(label);
            paramBindings.set(param.name, {
              param,
              setValue(nextValue) {
                input.checked = Boolean(nextValue);
                text.textContent = input.checked ? "On" : "Off";
              },
            });
          } else {
            const hasRange = Number.isFinite(param.rangeMin) && Number.isFinite(param.rangeMax);
            card.classList.add(hasRange ? "param-ranged" : "param-unbounded");
            const stepValue = scalarStepForParam(param);
            const step = String(stepValue);
            const currentValue = typeof param.value === "number" ? param.value : 0;

            if (hasRange) {
              const number = document.createElement("input");
              number.className = "param-number";
              number.type = "number";
              number.min = String(param.rangeMin);
              number.max = String(param.rangeMax);
              number.step = step;
              number.value = formatNumberForInput(currentValue, stepValue);
              number.disabled = !canEditRun;
              controls.appendChild(number);

              const rangeControl = (
                paramLayout === "knobs" ? createKnobControl : createSliderControl
              )(
                param,
                currentValue,
                step,
                (nextValue) => {
                  activeParamGestures.add(param.name);
                  param.value = nextValue;
                  const nextText = formatNumberForInput(nextValue, stepValue);
                  number.value = nextText;
                  scheduleParamMessage(param.name, nextValue);
                },
                (nextValue) => {
                  activeParamGestures.delete(param.name);
                  param.value = nextValue;
                  const nextText = formatNumberForInput(nextValue, stepValue);
                  number.value = nextText;
                  commitParamMessage(param.name, nextValue);
                },
              );
              controls.prepend(rangeControl.control);

              const sync = (nextValue) => {
                const parsed = Number(nextValue);
                if (!Number.isFinite(parsed)) {
                  return;
                }
                const quantized = constrainParamPlain(param, parsed);
                param.value = quantized;
                rangeControl.setValue(quantized);
                number.value = formatNumberForInput(quantized, stepValue);
              };

              number.addEventListener("change", () => {
                sync(number.value);
                commitParamMessage(param.name, Number(number.value));
              });
              paramBindings.set(param.name, { param, setValue: sync });
            } else {
              const number = document.createElement("input");
              number.className = "param-number";
              number.type = "number";
              number.step = step;
              number.value = formatNumberForInput(currentValue, stepValue);
              number.disabled = !canEditRun;
              number.addEventListener("change", () => {
                const parsed = Number(number.value);
                if (!Number.isFinite(parsed)) {
                  return;
                }
                const quantized = quantizeToStep(parsed, 0, stepValue);
                param.value = quantized;
                number.value = formatNumberForInput(quantized, stepValue);
                hostBridge.postMessage({
                  type: "setParam",
                  name: param.name,
                  value: quantized,
                  commit: true,
                });
              });
              controls.appendChild(number);
              paramBindings.set(param.name, {
                param,
                setValue(nextValue) {
                  const parsed = Number(nextValue);
                  if (!Number.isFinite(parsed)) {
                    return;
                  }
                  const quantized = quantizeToStep(parsed, 0, stepValue);
                  param.value = quantized;
                  number.value = formatNumberForInput(quantized, stepValue);
                },
              });
            }

          }

          paramsNode.appendChild(card);
        }
      }

      // ---------------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------------

      function bufferFileName(path) {
        const parts = String(path).split(/[\\/]/);
        return parts[parts.length - 1] || String(path);
      }

      function loadedBufferSummary(buffer) {
        const frames = Number(buffer.loadedFrames);
        const channels = Number(buffer.loadedChannels);
        const sampleRate = Number(buffer.loadedSampleRate);
        if (
          !Number.isSafeInteger(frames) || frames < 0
          || !Number.isSafeInteger(channels) || channels <= 0
          || !Number.isFinite(sampleRate) || sampleRate <= 0
        ) {
          return "";
        }
        return frames.toLocaleString() + " frames \u00b7 "
          + channels + " ch \u00b7 " + formatBufferSampleRate(sampleRate);
      }

      function formatBufferSampleRate(sampleRate) {
        if (sampleRate < 1_000) return Math.round(sampleRate) + " Hz";
        const khz = sampleRate / 1_000;
        return (Number.isInteger(khz) ? khz.toFixed(0) : khz.toFixed(1)) + " kHz";
      }

      function formatRunStatus(status, sampleRate, blockFrames) {
        if (
          !Number.isFinite(sampleRate)
          || sampleRate <= 0
          || !Number.isInteger(blockFrames)
          || blockFrames <= 0
        ) return status;
        return status
          + " \u2014 " + formatBufferSampleRate(sampleRate)
          + " \u00b7 " + blockFrames + " frames";
      }

      function selectRunSetting(select, value, label) {
        if (!Number.isFinite(value) || value <= 0) return;
        const stringValue = String(value);
        let option = [...select.options].find(candidate => candidate.value === stringValue);
        if (!option) {
          option = document.createElement("option");
          option.value = stringValue;
          option.textContent = label;
          option.dataset.custom = "true";
          select.appendChild(option);
        }
        select.value = stringValue;
      }

      function renderDeviceOptions(node, devices, selected, enabled) {
        if (!node) {
          return;
        }
        node.replaceChildren();
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default";
        node.appendChild(defaultOption);
        for (const device of devices || []) {
          const option = document.createElement("option");
          option.value = device;
          option.textContent = device;
          node.appendChild(option);
        }
        node.value = selected || "";
        node.disabled = !enabled;
      }

      if (mediaThemeQuery && typeof mediaThemeQuery.addEventListener === "function") {
        mediaThemeQuery.addEventListener("change", () => {
          if (bridgeThemePreference === "auto") {
            applyTheme();
          }
        });
      } else if (mediaThemeQuery && typeof mediaThemeQuery.addListener === "function") {
        mediaThemeQuery.addListener(() => {
          if (bridgeThemePreference === "auto") {
            applyTheme();
          }
        });
      }

      setupCollapsibleSections();
      setupParamLayoutToggle();
      applyTheme();
      render();
    </script>
  </body>
</html>
