<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f9ff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:image" content="{{ '/assets/png/onda-open-graph.png' | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Onda waveform logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/png/onda-open-graph.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="Onda waveform logo">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem('onda-theme')||'auto';</script>
    <link id="site-icon" rel="icon" href="{{ '/assets/svg/onda-logo-circle.svg' | relative_url }}" type="image/svg+xml" sizes="any" data-light="{{ '/assets/svg/onda-logo-circle.svg' | relative_url }}" data-dark="{{ '/assets/svg/onda-logo-dark-circle.svg' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/png/onda-apple-touch-icon.png' | relative_url }}">
    <link rel="mask-icon" href="{{ '/assets/svg/onda-mask-icon.svg' | relative_url }}" color="#143A63">
    <link rel="stylesheet" href="{{ '/assets/site/styles.css' | relative_url }}">
  </head>
  <body class="{% if page.layout == 'home' %}home-page{% elsif page.layout == 'play' %}play-page{% else %}docs-page{% endif %}">
    {% include header.html %}
    {% if page.layout == 'home' %}
      {{ content }}
    {% elsif page.layout == 'play' %}
      {{ content }}
    {% else %}
      <div class="docs-shell">
        {% include sidebar.html %}
        <main class="docs-content" id="main-content">
          <article class="prose">
            {{ content }}
          </article>
        </main>
        <aside class="page-toc" aria-label="On this page">
          <p class="sidebar-label">On this page</p>
          <nav id="page-toc"></nav>
        </aside>
      </div>
    {% endif %}
    <script type="module" src="{{ '/assets/site/site.js' | relative_url }}"></script>
  </body>
</html>
