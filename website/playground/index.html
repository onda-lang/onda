---
layout: play
title: Playground
description: Write, compile, and play Onda directly in your browser.
section: playground
permalink: /playground/
---

<main class="play-main" id="main-content" aria-label="Onda playground">
  <span class="play-status" role="status" data-status>Loading compiler...</span>

  <div class="play-workspace">
    <section class="play-panel play-editor">
      <div class="project-files">
        <div class="project-file-tabs" data-file-tabs></div>
        <button class="project-file-add" type="button" data-new-file title="New file" aria-label="New file" disabled>+</button>
        <details class="project-menu" data-project-menu>
          <summary class="project-menu-trigger">Project</summary>
          <div class="project-menu-content">
            <button type="button" data-new-project>New project</button>
            <button type="button" data-open-project>Open project</button>
            <button type="button" data-download-project>Download project</button>
            <button type="button" data-share-project>Share</button>
            <label class="editor-font-size">
              <span>Font size</span>
              <input type="number" min="6" max="40" step="1" value="16" inputmode="numeric" title="Clear the value to restore automatic sizing: 16px on desktop and touch screens, 12px in narrow desktop windows." data-editor-font-size>
            </label>
            <dl class="project-shortcuts" aria-label="Keyboard shortcuts">
              <div><dt>Play</dt><dd><kbd>Ctrl/⌘ S</kbd><kbd>Ctrl/⌘ ↵</kbd></dd></div>
              <div><dt>Stop</dt><dd><kbd>Ctrl/⌘ .</kbd></dd></div>
            </dl>
          </div>
        </details>
      </div>
      <div class="play-source-editor" data-editor></div>
    </section>

    <aside class="play-panel play-run-panel" aria-busy="true">
      <p class="play-run-loading" data-run-loading aria-hidden="true">Loading compiler...</p>
      <iframe class="play-run-view" title="Onda run view" data-run-view></iframe>
    </aside>
  </div>
</main>

<script type="importmap">
  {
    "imports": {
      "@onda-lang/processor-abi": "{{ site.data.onda.asset_path | append: '/processor-abi.js' | relative_url }}",
      "@onda-lang/wasm-compiler": "{{ site.data.onda.asset_path | append: '/compiler/src/index.js' | relative_url }}",
      "@onda-lang/webaudio": "{{ site.data.onda.asset_path | append: '/webaudio.js' | relative_url }}",
      "#onda-frontend-loader": "{{ site.data.onda.asset_path | append: '/compiler/src/frontend-browser.js' | relative_url }}"
    }
  }
</script>
<script>
  globalThis.__ONDA_PLAYGROUND_ASSETS__ = {
    workerUrl: {{ site.data.onda.asset_path | append: '/compiler-worker.js' | relative_url | jsonify }},
    frontendWasm: {{ site.data.onda.asset_path | append: '/onda_compiler_web_bg.wasm' | relative_url | jsonify }},
    workletUrl: {{ site.data.onda.asset_path | append: '/worklet.js' | relative_url | jsonify }},
    runViewUrl: {{ site.data.onda.asset_path | append: '/gpu/index.html' | relative_url | jsonify }},
    exampleCatalogUrl: {{ site.data.onda.asset_path | append: '/example-projects.json' | relative_url | jsonify }},
    smokeResultUrl: {{ '/__result' | relative_url | jsonify }}
  };
</script>
<script type="module" src="{{ site.data.onda.asset_path | append: '/playground.js' | relative_url }}"></script>
