[package]
name = "omni_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
cpal = "0.16"
hound = "3.5.1"
omni_daemon = { path = "../omni_daemon" }
omni_codegen_llvm = { path = "../omni_codegen_llvm" }
omni_frontend = { path = "../omni_frontend" }
omni_runtime = { path = "../omni_runtime" }
omni_semantics = { path = "../omni_semantics" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
omni_window = { path = "../omni_window" }
