[package]
name = "onda_egui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
ui-bench = []

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.31", features = ["svg"] }
onda_run = { path = "../onda_run", features = ["native-window"] }
onda_project = { path = "../onda_project" }
rfd = "0.15"
raw-window-handle = "0.6"
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
