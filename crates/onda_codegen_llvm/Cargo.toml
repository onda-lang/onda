[package]
name = "onda_codegen_llvm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = ["llvm-orc"]
llvm-orc = ["dep:llvm-sys"]

[dependencies]
onda_frontend = { path = "../onda_frontend" }
onda_mir = { path = "../onda_mir" }
onda_processor_abi = { path = "../onda_processor_abi" }
onda_semantics = { path = "../onda_semantics" }
llvm-sys = { version = "211.0.0", optional = true, features = ["no-llvm-linking"] }
serde = { version = "1.0", features = ["derive"] }

[lib]
path = "src/lib.rs"
