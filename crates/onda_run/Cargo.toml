[package]
name = "onda_run"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
native-window = ["dep:raw-window-handle", "dep:x11rb", "dep:x11-dl", "dep:windows-sys", "dep:objc2-app-kit"]

[dependencies]
raw-window-handle = { version = "0.6", optional = true }
onda_scope = { path = "../onda_scope" }
base64 = "0.22"
libc = "0.2"
midir = "0.11"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
onda_daemon = { path = "../onda_daemon" }
onda_codegen_llvm = { path = "../onda_codegen_llvm" }
onda_cpal = { path = "../onda_cpal" }
onda_frontend = { path = "../onda_frontend" }
onda_host_protocol = { path = "../onda_host_protocol" }
onda_project = { path = "../onda_project" }
onda_semantics = { path = "../onda_semantics" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }
x11-dl = { version = "2.21", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
