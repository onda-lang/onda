name: Windows native editor diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-failure-windows-x64
          run-id: 40904539811
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tests
      - uses: actions/download-artifact@v7
        with:
          name: onda-windows-x64
          run-id: 40900636570
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sdk
      - name: Extract SDK
        run: |
          Expand-Archive sdk/onda-0.9.0-windows-x64.zip -DestinationPath sdk
          $library = (Resolve-Path sdk/onda-0.9.0-windows-x64/lib/onda_ui.dll).Path
          "ONDA_GPU_UI_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Debugger available: $(Test-Path 'C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe')"
      - name: Reproduce native editor crash
        env:
          RUST_BACKTRACE: '1'
        run: |
          $binary = Get-ChildItem tests -Recurse -Filter onda_processor_tests.exe | Select-Object -First 1
          & $binary.FullName GpuEditorTeardown
          if ($LASTEXITCODE -ne 0) { throw "Native editor exited $LASTEXITCODE" }
      - name: Read native crash module
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*onda_processor_tests*' } |
            Select-Object TimeCreated, Message | Format-List
          exit 0
