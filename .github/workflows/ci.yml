name: Saved Windows native editor regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-failure-windows-x64
          run-id: 40904539811
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tests
      - uses: actions/download-artifact@v7
        with:
          name: primary-backends-ui
          run-id: 40909159317
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-ui
      - name: Exercise saved native editor scenarios with corrected DLL
        run: |
          $binary = Get-ChildItem tests -Recurse -Filter onda_processor_tests.exe | Select-Object -First 1
          $env:ONDA_GPU_UI_LIBRARY = (Resolve-Path native-ui/onda_ui.dll).Path
          foreach ($case in @('GpuEditorTeardown', 'GpuEditorPeerRecreation', 'NativeEditor')) {
            1..3 | ForEach-Object {
              & $binary.FullName $case
              if ($LASTEXITCODE -ne 0) { throw "$case failed on iteration $_ with $LASTEXITCODE" }
            }
          }
