name: macOS compiler initialization diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Bootstrap LLVM
        run: ./scripts/bootstrap-llvm.sh --version 22.1.0
      - name: Reproduce concurrent compiler tests with immediate failure output
        shell: bash
        run: |
          source ./scripts/use-llvm-env.sh --flavor prebuilt --version 22.1.0
          cargo test --release -p onda_codegen_llvm --test math_policy -- --nocapture
