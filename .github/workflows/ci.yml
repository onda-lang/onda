name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: 21.1.2

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test portable compiler layers
        run: cargo test -p onda_mir -p onda_semantics -p onda_compiler_web

      - name: Check portable compiler layers
        run: cargo check -p onda_mir -p onda_semantics -p onda_compiler_web

      - name: Lint MIR transport and browser boundary
        run: cargo clippy -p onda_mir -p onda_realtime -p onda_compiler_web --all-targets --no-deps -- -D warnings

  native-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Bootstrap LLVM
        run: ./scripts/bootstrap-llvm.sh --version "$LLVM_VERSION"

      - name: Verify package versions
        run: node ./scripts/sync-package-versions.mjs --check

      - name: Test Rust workspace outside PipeWire-dependent hosts
        shell: bash
        run: |
          source ./scripts/use-llvm-env.sh --flavor prebuilt --version "$LLVM_VERSION"
          cargo test --workspace --release \
            --exclude onda_cpal \
            --exclude onda_run \
            --exclude onda_cli \
            --exclude onda_egui \
            --exclude onda_webview

      - name: Install JavaScript workspace
        run: npm ci

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Test Binaryen backend and LLVM parity
        shell: bash
        run: |
          source ./scripts/use-llvm-env.sh --flavor prebuilt --version "$LLVM_VERSION"
          npm test --workspace @onda-lang/binaryen-web
          npm run test:onda --workspace @onda-lang/binaryen-web

      - name: Test full Onda source corpus with Binaryen
        shell: bash
        run: |
          source ./scripts/use-llvm-env.sh --flavor prebuilt --version "$LLVM_VERSION"
          npm run test:corpus --workspace @onda-lang/binaryen-web

      - name: Test WebAssembly compiler product package
        run: |
          npm test --workspace @onda-lang/processor-abi
          npm test --workspace @onda-lang/webaudio
          npm run build --workspace @onda-lang/wasm-compiler
          npm run test:built --workspace @onda-lang/wasm-compiler
          npm run test:pack:built --workspace @onda-lang/wasm-compiler
