name: Windows GPU diagnostics
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Reuse the renderer executable from this diagnostic run
        type: string
        default: ''
      test_filter:
        description: Optional Rust test name filter
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.artifact_run == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Compile renderer test executable
        run: |
          cargo test --release -p onda_ui --features ffi --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw "Test compilation failed" }
      - uses: actions/upload-artifact@v6
        with:
          name: renderer-tests
          path: target/release/deps/onda_ui-*.exe
          retention-days: 1
          if-no-files-found: error
  diagnose:
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.artifact_run != '') }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-parallel
            backend: ''
            threads: 0
          - name: default-serial
            backend: ''
            threads: 1
          - name: dx12-serial
            backend: dx12
            threads: 1
          - name: vulkan-serial
            backend: vulkan
            threads: 1
    name: ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: renderer-tests
          run-id: ${{ inputs.artifact_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise renderer
        env:
          TEST_BACKEND: ${{ matrix.backend }}
          TEST_THREADS: ${{ matrix.threads }}
          TEST_FILTER: ${{ inputs.test_filter }}
          RUST_BACKTRACE: '1'
        run: |
          if ($env:TEST_BACKEND) { $env:WGPU_BACKEND = $env:TEST_BACKEND }
          $binary = Get-ChildItem -Filter 'onda_ui-*.exe' | Select-Object -First 1
          $arguments = @('--nocapture')
          if ($env:TEST_FILTER) { $arguments += $env:TEST_FILTER }
          if ($env:TEST_THREADS -ne '0') { $arguments += "--test-threads=$env:TEST_THREADS" }
          & $binary.FullName @arguments
          if ($LASTEXITCODE -ne 0) { throw "Renderer exited $LASTEXITCODE" }
      - name: Read native crash module
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*onda_ui*' } |
            Select-Object TimeCreated, Message | Format-List
          exit 0
