name: Build Onda Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLVM_VERSION: 21.1.2

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish archives to a GitHub release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            platform: windows
            arch: x64
            archive_ext: zip
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            archive_ext: tar.xz
          - name: macos-arm64
            runner: macos-14
            platform: macos
            arch: arm64
            archive_ext: tar.xz

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

          pipewire_version="$(pkg-config --modversion libpipewire-0.3)"
          if ! printf '%s\n%s\n' "0.3.53" "$pipewire_version" | sort -V -C; then
            echo "PipeWire >= 0.3.53 is required; found $pipewire_version" >&2
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "failed to read workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag_name="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Bootstrap LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-llvm.ps1 -Version "${{ env.LLVM_VERSION }}"

      - name: Bootstrap LLVM on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/bootstrap-llvm.sh --version "${{ env.LLVM_VERSION }}"

      - name: Build onda and onda_api on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) {
            throw "Visual Studio with MSVC tools not found"
          }

          $devCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat not found at $devCmd"
          }

          $captureEnvScript = Join-Path $env:RUNNER_TEMP "capture-msvc-env.cmd"
          @"
          @echo off
          call "$devCmd" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b %errorlevel%
          set
          "@ | Set-Content -Path $captureEnvScript -Encoding ascii

          $msvcEnv = cmd.exe /d /c $captureEnvScript
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize MSVC build environment via VsDevCmd.bat"
          }

          foreach ($line in $msvcEnv) {
            if ($line -match '^(.*?)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }

          . .\scripts\use-llvm-env.ps1 -Flavor prebuilt -Version "${{ env.LLVM_VERSION }}"
          $llvmBinDir = Split-Path -Parent (Get-Command llvm-readobj).Source
          $llvmBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Both targets produce onda.pdb on MSVC, so Cargo must build them separately.
          cargo build --release -p onda_api
          cargo build --release -p onda_cli
          $ondaCmakeDir = Join-Path $PWD "cmake"
          cmake `
            -S tests\cmake_sdk `
            -B target\cmake-sdk `
            -A x64 `
            "-DOnda_DIR=$ondaCmakeDir"
          cmake --build target\cmake-sdk --config Release

          $resources = & llvm-readobj --coff-resources target\release\onda.exe
          if ($LASTEXITCODE -ne 0 -or -not ($resources -match 'Type:\s+(?:GROUP_)?ICON\b')) {
            throw "onda.exe does not contain the application icon resource"
          }
          $launcherResources = & llvm-readobj --coff-resources target\release\onda-run.exe
          if ($LASTEXITCODE -ne 0 -or -not ($launcherResources -match 'Type:\s+(?:GROUP_)?ICON\b')) {
            throw "onda-run.exe does not contain the application icon resource"
          }
          $cliHeaders = & llvm-readobj --file-headers target\release\onda.exe
          if ($LASTEXITCODE -ne 0 -or -not ($cliHeaders -match 'IMAGE_SUBSYSTEM_WINDOWS_CUI')) {
            throw "onda.exe is not a Windows console application"
          }
          $launcherHeaders = & llvm-readobj --file-headers target\release\onda-run.exe
          if ($LASTEXITCODE -ne 0 -or -not ($launcherHeaders -match 'IMAGE_SUBSYSTEM_WINDOWS_GUI')) {
            throw "onda-run.exe is not a console-free Windows GUI application"
          }

      - name: Build onda and onda_api on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source ./scripts/use-llvm-env.sh --flavor prebuilt --version "${{ env.LLVM_VERSION }}"
          cargo build --release -p onda_cli -p onda_api
          cmake \
            -S tests/cmake_sdk \
            -B target/cmake-sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -DOnda_DIR="$PWD/cmake"
          cmake --build target/cmake-sdk --parallel

      - name: Package release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageRoot = Join-Path $PWD ("dist/onda-" + $version + "-windows-x64")
          $binDir = Join-Path $packageRoot "bin"
          $libDir = Join-Path $packageRoot "lib"
          $includeDir = Join-Path $packageRoot "include"
          $cmakeDir = Join-Path $libDir "cmake\Onda"

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          New-Item -ItemType Directory -Force -Path $includeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null

          Copy-Item target\release\onda.exe $binDir
          Copy-Item target\release\onda-run.exe (Join-Path $packageRoot "Onda.exe")
          Copy-Item target\release\onda.dll $libDir
          if (Test-Path target\release\onda.lib) {
            Copy-Item target\release\onda.lib $libDir
          }
          if (Test-Path target\release\onda.dll.lib) {
            Copy-Item target\release\onda.dll.lib $libDir
          }
          if (Test-Path target\release\onda.exp) {
            Copy-Item target\release\onda.exp $libDir
          }
          Copy-Item include\onda.h $includeDir
          Copy-Item include\onda_processor_abi.h $includeDir
          Copy-Item cmake\OndaConfig.cmake $cmakeDir
          Copy-Item LICENSE $packageRoot
          Copy-Item README.md $packageRoot
          Copy-Item CHANGELOG.md $packageRoot
          Copy-Item docs\syntax.md $packageRoot
          Copy-Item examples $packageRoot -Recurse

          $packagedCmakeBuildDir = Join-Path $PWD "target\cmake-sdk-packaged"
          cmake `
            -S tests\cmake_sdk `
            -B $packagedCmakeBuildDir `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$packageRoot"
          cmake --build $packagedCmakeBuildDir --config Release --verbose

          $archive = Join-Path $PWD ("dist/onda-" + $version + "-windows-x64.zip")
          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $archive

      - name: Package release on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package_root="$PWD/dist/onda-$version-${{ matrix.platform }}-${{ matrix.arch }}"
          bin_dir="$package_root/bin"
          lib_dir="$package_root/lib"
          include_dir="$package_root/include"
          cmake_dir="$lib_dir/cmake/Onda"

          mkdir -p "$bin_dir" "$lib_dir" "$include_dir" "$cmake_dir"

          cp target/release/onda "$bin_dir/"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp target/release/libonda.dylib "$lib_dir/"
            cp target/release/libonda.a "$lib_dir/"

            app_contents="$package_root/Onda.app/Contents"
            app_macos="$app_contents/MacOS"
            app_resources="$app_contents/Resources"
            mkdir -p "$app_macos" "$app_resources"
            ln "$bin_dir/onda" "$app_macos/onda-cli"
            cp assets/macos/onda-launcher "$app_macos/onda"
            chmod +x "$app_macos/onda"
            cp assets/macos/Info.plist "$app_contents/"
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleShortVersionString $version" \
              -c "Set :CFBundleVersion $version" \
              "$app_contents/Info.plist"

            icon_work_dir="$(mktemp -d "$RUNNER_TEMP/onda-icons.XXXXXX")"
            iconset_dir="$icon_work_dir/Onda.iconset"
            mkdir "$iconset_dir"
            for size in 16 32 128 256 512; do
              double_size=$((size * 2))
              sips -z "$size" "$size" assets/png/onda-logo-light-dark.png \
                --out "$iconset_dir/icon_${size}x${size}.png"
              sips -z "$double_size" "$double_size" assets/png/onda-logo-light-dark.png \
                --out "$iconset_dir/icon_${size}x${size}@2x.png"
            done
            iconutil -c icns "$iconset_dir" -o "$app_resources/Onda.icns"
            plutil -lint "$app_contents/Info.plist"
            test -x "$app_macos/onda"
            test -x "$app_macos/onda-cli"
            test -s "$app_resources/Onda.icns"
          else
            cp target/release/libonda.so "$lib_dir/"
            cp target/release/libonda.a "$lib_dir/"
            mkdir -p \
              "$package_root/share/applications" \
              "$package_root/share/icons/hicolor/512x512/apps"
            cp assets/linux/onda-run.desktop "$package_root/share/applications/"
            cp assets/png/onda-logo-light-dark.png \
              "$package_root/share/icons/hicolor/512x512/apps/onda-run.png"
            cp assets/linux/install.sh assets/linux/uninstall.sh "$package_root/"
            chmod +x "$package_root/install.sh" "$package_root/uninstall.sh"

            install_test_root="$(mktemp -d "$RUNNER_TEMP/onda-install.XXXXXX")"
            install_test_home="$install_test_root/home with spaces"
            install_test_data="$install_test_root/data home"
            mkdir -p "$install_test_home"
            HOME="$install_test_home" XDG_DATA_HOME="$install_test_data" \
              "$package_root/install.sh"
            test -x "$install_test_home/.local/bin/onda"
            grep -F \
              "Exec=\"$install_test_home/.local/bin/onda\" run %f" \
              "$install_test_data/applications/onda-run.desktop"
            grep -F \
              "TryExec=$install_test_home/.local/bin/onda" \
              "$install_test_data/applications/onda-run.desktop"
            HOME="$install_test_home" XDG_DATA_HOME="$install_test_data" \
              "$package_root/uninstall.sh"
            test ! -e "$install_test_home/.local/bin/onda"
            test ! -e "$install_test_data/applications/onda-run.desktop"
            test ! -e "$install_test_data/icons/hicolor/512x512/apps/onda-run.png"
          fi
          cp include/onda.h "$include_dir/"
          cp include/onda_processor_abi.h "$include_dir/"
          cp cmake/OndaConfig.cmake "$cmake_dir/"
          cp LICENSE "$package_root/"
          cp README.md "$package_root/"
          cp CHANGELOG.md "$package_root/"
          cp docs/syntax.md "$package_root/"
          cp -R examples "$package_root/"

          cmake \
            -S tests/cmake_sdk \
            -B target/cmake-sdk-packaged \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$package_root"
          cmake --build target/cmake-sdk-packaged --parallel --verbose

          archive="$PWD/dist/onda-$version-${{ matrix.platform }}-${{ matrix.arch }}.tar.xz"
          tar -C "$PWD/dist" -cJf "$archive" "$(basename "$package_root")"

      - name: Verify CMake SDK exports
        if: runner.os != 'Windows'
        shell: bash
        run: |
          module=target/cmake-sdk-packaged/libonda_cmake_static_smoke.so
          bash tests/cmake_sdk/check-exports.sh "$module"

      - name: Verify macOS shared SDK identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tests/cmake_sdk/check-macos-shared-library.sh \
            target/release/libonda.dylib \
            target/cmake-sdk-packaged/libonda_cmake_shared_smoke.so

      - name: Verify Linux shared SDK identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/cmake_sdk/check-linux-shared-library.sh \
            target/release/libonda.so \
            target/cmake-sdk-packaged/libonda_cmake_shared_smoke.so

      - name: Verify CMake SDK exports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $module = Join-Path $PWD "target\cmake-sdk-packaged\Release\onda_cmake_static_smoke.dll"
          .\tests\cmake_sdk\check-exports.ps1 -Module $module

      - name: Verify Windows shared SDK identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $module = Join-Path $PWD "target\cmake-sdk-packaged\Release\onda_cmake_shared_smoke.dll"
          .\tests\cmake_sdk\check-windows-shared-library.ps1 -Consumer $module

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: onda-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.archive_ext }}
          retention-days: 1

  web:
    name: WebAssembly compiler packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install package dependencies
        run: |
          node ./scripts/sync-package-versions.mjs --check
          npm ci

      - name: Test WebAssembly packages
        run: |
          npm test --workspace @onda-lang/processor-abi
          npm test --workspace @onda-lang/binaryen-web
          npm test --workspace @onda-lang/webaudio
          npm run build --workspace @onda-lang/wasm-compiler
          npm run test:built --workspace @onda-lang/wasm-compiler
          npm run test:pack:built --workspace @onda-lang/wasm-compiler

      - name: Pack WebAssembly packages
        run: |
          mkdir -p dist
          npm pack ./packages/onda_processor_abi --pack-destination dist
          npm pack ./packages/onda_binaryen_web --pack-destination dist
          npm pack ./packages/onda_webaudio --pack-destination dist
          npm pack ./packages/onda_wasm_compiler --ignore-scripts --pack-destination dist

      - name: Upload WebAssembly package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: onda-web-packages
          path: dist/*.tgz
          retention-days: 1

  npm-publish:
    name: Publish npm packages
    if: github.event_name == 'push'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download tested npm packages
        uses: actions/download-artifact@v7
        with:
          name: onda-web-packages
          path: dist

      - name: Validate package versions
        shell: bash
        run: |
          packages=(dist/*.tgz)
          if [[ "${#packages[@]}" -ne 4 ]]; then
            echo "expected 4 npm packages, found ${#packages[@]}" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          for package in "${packages[@]}"; do
            package_version="$(tar -xOf "$package" package/package.json \
              | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk).on("end", () => process.stdout.write(JSON.parse(data).version))')"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "$package has version $package_version, expected $tag_version" >&2
              exit 1
            fi
          done

      - name: Publish with npm trusted publishing
        run: |
          npm install --global npm@latest
          npm publish ./dist/onda-lang-processor-abi-*.tgz --access public --provenance
          npm publish ./dist/onda-lang-binaryen-web-*.tgz --access public --provenance
          npm publish ./dist/onda-lang-webaudio-*.tgz --access public --provenance
          npm publish ./dist/onda-lang-wasm-compiler-*.tgz --access public --provenance

  release:
    name: Publish Release
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs: [build, web]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "failed to read workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag_name="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Validate pushed tag matches workspace version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          pushed_tag="${GITHUB_REF_NAME}"
          expected_v_tag="${{ steps.version.outputs.tag_name }}"
          expected_plain_tag="${{ steps.version.outputs.version }}"
          if [[ "$pushed_tag" != "$expected_v_tag" && "$pushed_tag" != "$expected_plain_tag" ]]; then
            echo "pushed tag '$pushed_tag' does not match workspace version '${{ steps.version.outputs.version }}'" >&2
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.tgz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name || steps.version.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t release_files < <(
            find dist -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.tgz' -o -name 'SHA256SUMS.txt' \) \
              | sort
          )

          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "no release artifacts found under dist/" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME"
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" --title "$RELEASE_NAME" --notes ""
          fi
