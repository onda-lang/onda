name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/**"
      - "examples/web/onda_wasm_playground/**"
      - "package-lock.json"
      - "package.json"
      - "packages/onda_binaryen_web/**"
      - "packages/onda_processor_abi/**"
      - "packages/onda_wasm_compiler/**"
      - "packages/onda_webaudio/**"
      - "scripts/build-website-playground.mjs"
      - "scripts/bundle-web-playground.mjs"
      - "scripts/sync-package-versions.mjs"
      - "stdlib/**"
      - "ui/**"
      - "website/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/**"
      - "examples/web/onda_wasm_playground/**"
      - "package-lock.json"
      - "package.json"
      - "packages/onda_binaryen_web/**"
      - "packages/onda_processor_abi/**"
      - "packages/onda_wasm_compiler/**"
      - "packages/onda_webaudio/**"
      - "scripts/build-website-playground.mjs"
      - "scripts/bundle-web-playground.mjs"
      - "scripts/sync-package-versions.mjs"
      - "stdlib/**"
      - "ui/**"
      - "website/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install browser build tools
        run: |
          npm ci
          cargo install wasm-pack --locked

      - name: Build versioned browser compiler assets
        run: |
          npm run check:versions
          npm run build:website

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Stage website and shared documentation
        run: bash ./website/stage.sh

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
