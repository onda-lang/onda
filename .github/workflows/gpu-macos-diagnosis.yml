name: Validate corrected macOS VST3

on:
  push:
    branches: [ci/gpu-integration]
    paths: [.github/workflows/gpu-macos-diagnosis.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: onda-macos-arm64
          run-id: 41228859300
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onda-sdk
      - name: Verify SDK source revision
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/onda-sdk/onda-source.txt")" = 198d4c2eb91fd808407c6967fec5f42e73697d9a
      - uses: actions/upload-artifact@v6
        with:
          name: onda-macos-arm64
          path: ${{ runner.temp }}/onda-sdk/
          compression-level: 0
          retention-days: 1
  plugin:
    needs: sdk
    permissions:
      contents: read
    uses: onda-lang/onda-plugin/.github/workflows/build.yml@4675ffd1df3668443935de467f85b75941c3f7e4
    with:
      source_ref: 4675ffd1df3668443935de467f85b75941c3f7e4
      onda_source_ref: 198d4c2eb91fd808407c6967fec5f42e73697d9a
      platform: macos-arm64
      tests: package
